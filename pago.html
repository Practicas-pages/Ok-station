<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <script src="assets/site-guard.js?v=20260813"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Pago de tu pedido — OK.station</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css?v=20260813">
  <link rel="stylesheet" href="assets/auth.css?v=20260813">
  <link rel="stylesheet" href="assets/order.css?v=20260813">
</head>
<body class="auth-page">

  <header class="auth-top">
    <a href="index.html" class="logo"><img src="assets/img/okstation-logo.svg" alt="OK.station" class="logo__img" width="158" height="24"></a>
    <a href="perfil.html#pedidos" class="auth-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Volver a mis pedidos
    </a>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-head">
        <h1>Pago seguro</h1>
        <p>Revisa el resumen y confirma el pago de tu pedido.</p>
      </div>

      <div class="auth-alert" id="pago-alert" role="alert" hidden></div>

      <div id="pago-summary" style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
        <p style="color:var(--text-muted)">Cargando pedido…</p>
      </div>

      <div id="pago-actions" hidden>
        <button type="button" class="btn btn--primary btn--block" id="pago-pay">Pagar ahora</button>
        <button type="button" class="btn btn--light btn--block" id="pago-cancel" style="margin-top:10px">Cancelar</button>
        <p class="auth-foot" id="pago-note" style="margin-top:12px"></p>
      </div>
    </div>
  </main>

  <script>
  (function () {
    "use strict";
    var API = "/backend/api";
    function token() { try { return localStorage.getItem("okstation.token"); } catch (e) { return null; } }
    function qs(k) { return new URLSearchParams(location.search).get(k); }
    function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
    function mxn(n) { return new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", minimumFractionDigits: 2 }).format(+n || 0); }
    function alertBox(msg) { var a = document.getElementById("pago-alert"); a.textContent = msg; a.hidden = false; }

    if (!token()) { location.href = "cuenta.html"; return; }

    var orderId = qs("order"), ref = qs("ref");
    var summary = document.getElementById("pago-summary");
    var actions = document.getElementById("pago-actions");
    var note = document.getElementById("pago-note");

    if (!orderId) { summary.innerHTML = ""; alertBox("Falta el identificador del pedido."); return; }

    fetch(API + "/payments/status.php?order_id=" + encodeURIComponent(orderId), { headers: { Authorization: "Bearer " + token() } })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) { summary.innerHTML = ""; alertBox((res && res.error) || "No se pudo cargar el pedido."); return; }
        if (res.payment_status === "pagado") {
          summary.innerHTML = '<div class="order-pay order-pay--paid"><div class="order-pay__head"><span class="order-pay__title">Este pedido ya está pagado</span><span class="opay opay--pagado">Pagado</span></div></div>';
          note.innerHTML = '<a href="perfil.html#pedidos">Volver a mis pedidos</a>';
          actions.hidden = false;
          document.getElementById("pago-pay").hidden = true;
          document.getElementById("pago-cancel").textContent = "Volver";
          return;
        }
        summary.innerHTML =
          '<div class="order-pay"><div class="order-pay__head"><span class="order-pay__title">Resumen del pedido</span><span class="opay opay--' + esc(res.payment_status) + '">' + esc(res.payment_status) + '</span></div>' +
          '<div class="order-pay__body">' +
            (ref ? '<div class="order-pay__row order-pay__muted"><span>Referencia</span><span class="mono">' + esc(ref) + '</span></div>' : '') +
            '<div class="order-pay__row"><span>Total a pagar</span><b>' + mxn(res.total) + '</b></div>' +
          '</div></div>';
        actions.hidden = false;
        note.textContent = "Entorno de demostración (sandbox): no se realiza ningún cargo real.";
      })
      .catch(function () { summary.innerHTML = ""; alertBox("Sin conexión con el servidor."); });

    function confirm(result, btn) {
      var orig = btn.textContent;
      btn.disabled = true; btn.textContent = "Procesando…";
      fetch(API + "/payments/sandbox-confirm.php", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + token() },
        body: JSON.stringify({ reference: ref, result: result })
      }).then(function (r) { return r.json(); }).then(function (res) {
        if (res && res.ok) { location.href = "perfil.html#pedidos"; return; }
        btn.disabled = false; btn.textContent = orig;
        alertBox((res && res.error) || "No se pudo confirmar el pago.");
      }).catch(function () { btn.disabled = false; btn.textContent = orig; alertBox("Sin conexión con el servidor."); });
    }

    document.getElementById("pago-pay").addEventListener("click", function () { confirm("pagado", this); });
    document.getElementById("pago-cancel").addEventListener("click", function () { location.href = "perfil.html#pedidos"; });
  })();
  </script>
</body>
</html>
