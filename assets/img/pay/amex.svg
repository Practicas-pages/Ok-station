<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 26" role="img" aria-label="American Express">
  <!-- American Express: recuadro azul con la marca en blanco. A 32px de alto
       "AMERICAN EXPRESS" completo sería ilegible, por eso va la forma corta. -->
  <rect x="0" y="0" width="40" height="26" rx="3" fill="#006FCF"/>
  <text x="20" y="17.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="10" font-weight="700" letter-spacing="0.4" fill="#FFFFFF">AMEX</text>
</svg>
