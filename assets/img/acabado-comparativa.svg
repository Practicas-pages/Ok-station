<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img" aria-label="Comparación de acabado brillante y mate">
  <defs>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9C1DFF"/>
      <stop offset="55%" stop-color="#066CFF"/>
      <stop offset="100%" stop-color="#00C6FF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r1"><rect x="20" y="16" width="160" height="100" rx="10"/></clipPath>
    <clipPath id="r2"><rect x="220" y="16" width="160" height="100" rx="10"/></clipPath>
  </defs>

  <!-- Brillante -->
  <g clip-path="url(#r1)">
    <rect x="20" y="16" width="160" height="100" fill="url(#photo)"/>
    <polygon points="20,16 110,16 60,116 20,116" fill="url(#gloss)"/>
    <circle cx="150" cy="44" r="13" fill="#ffffff" opacity="0.85"/>
  </g>
  <rect x="20" y="16" width="160" height="100" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="100" y="138" text-anchor="middle" font-family="Poppins, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0A0A0F">Brillante</text>
  <text x="100" y="156" text-anchor="middle" font-family="Poppins, system-ui, sans-serif" font-size="11" fill="#6B7280">Brillo y colores vivos</text>

  <!-- Mate -->
  <g clip-path="url(#r2)">
    <rect x="220" y="16" width="160" height="100" fill="url(#photo)"/>
    <rect x="220" y="16" width="160" height="100" fill="#3a3f55" opacity="0.34"/>
    <rect x="220" y="16" width="160" height="100" fill="#ffffff" opacity="0.05"/>
  </g>
  <rect x="220" y="16" width="160" height="100" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="300" y="138" text-anchor="middle" font-family="Poppins, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0A0A0F">Mate</text>
  <text x="300" y="156" text-anchor="middle" font-family="Poppins, system-ui, sans-serif" font-size="11" fill="#6B7280">Sin reflejos, suave</text>
</svg>
