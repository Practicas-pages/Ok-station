<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tema (claro/oscuro): antes de los estilos para pintar ya con el tema elegido -->
  <script src="assets/theme.js?v=20260721a"></script>
  <meta name="robots" content="noindex, follow">
  <title>Acceso restringido — Ok.station</title>
  <meta name="theme-color" content="#066CFF">
  <link rel="icon" href="/assets/img/OKD-Isotipo-Azul-96.png" type="image/png" sizes="96x96">
  <!-- Estilos EN LA PAGINA a proposito (ver 404.html): debe verse bien aunque
       styles.css no cargue. -->
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
      background:#F5F8FD;color:#12141C}
    .card{max-width:560px;width:100%;background:#fff;border:1px solid #E3E8F1;
      border-radius:18px;padding:clamp(28px,5vw,48px);text-align:center;
      box-shadow:0 10px 40px rgba(18,20,28,.07)}
    .code{font-size:clamp(3.2rem,10vw,4.6rem);font-weight:800;line-height:1;
      color:#066CFF;letter-spacing:-.03em;margin:0}
    h1{font-size:clamp(1.25rem,3.5vw,1.6rem);margin:14px 0 10px;letter-spacing:-.02em}
    p{color:#5b6474;margin:0 0 26px;line-height:1.6}
    .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    a.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;
      border-radius:99px;font-weight:600;font-size:.95rem;text-decoration:none;
      border:1.5px solid transparent;transition:.15s}
    .primary{background:#066CFF;color:#fff}
    .primary:hover{background:#0559d6}
    .ghost{background:#fff;color:#12141C;border-color:#E3E8F1}
    .ghost:hover{background:#F5F8FD}
    .brand{margin-top:26px;font-size:.82rem;color:#8b93a3}
    .brand b{color:#066CFF}

    /* ── Modo oscuro (html[data-theme="dark"], lo pone theme.js) ──
       Esta página es autosuficiente, así que trae su propio bloque. ── */
    html[data-theme="dark"] body{background:#0F1524;color:#E9EDF6}
    html[data-theme="dark"] .card{background:#171F31;border-color:#26314A;
      box-shadow:0 10px 40px rgba(0,0,0,.35)}
    html[data-theme="dark"] p{color:#8A94AB}
    html[data-theme="dark"] .ghost{background:#171F31;color:#E9EDF6;border-color:#3A4763}
    html[data-theme="dark"] .ghost:hover{background:#1E2840}
    html[data-theme="dark"] .brand{color:#67708A}
  </style>
</head>
<body>
  <main class="card">
    <p class="code">403</p>
    <h1>Esta sección es privada</h1>
    <p>No tienes permiso para ver esta página. Si es tu cuenta,
       inicia sesión para continuar.</p>
    <div class="btns">
      <a class="btn primary" href="/cuenta">Iniciar sesión</a>
      <a class="btn ghost" href="/">Ir al inicio</a>
      <a class="btn ghost" href="/contactanos">Contacto</a>
    </div>
    <p class="brand"><b>Ok.station</b> — Centro Comercial Otay, Tijuana</p>
  </main>
</body>
</html>
