      <div class="tdpv-sideh"><b>Ficha técnica</b><button type="button" class="td-dx" data-pvside="tdpvSpecsP" aria-label="Cerrar ficha">×</button></div>
      <div class="tdpv-sideb" id="tdpvSpecsB"></div>
    </div>
  </div>
</aside>

<script>
(function(){
  "use strict";
  /* ═══ Estado ═══ */
  var PER = 24;                 // productos por página (scroll infinito)
  var page = 1, pages = 1, loading = false, done = false, loadToken = 0;
  var q = "", cat = "";
  /* Estado del panel de filtros. fSort="name" es el orden por defecto del API (no se
     manda mientras esté así). fBrands: marcas elegidas. */
  var fBrands = [], fSort = "name", fBrandsLoaded = false, fBrandList = [];
  /* Faceta "Tipo" = subcategoría (dato real de la BD: Tinta, Tóner, Carpetas, Papel Bond…). */
  var fSubcats = [], fSubcatsLoaded = false, fSubcatList = [];
  var pre = {};                 // pre-carrito local: { id: {p, qty} }
  /* Checkout DENTRO del panel de carrito: perfil + libreta de direcciones + envío. */
  var me = null, coAddr = null, coShip = "retiro";
  var locAddrs = [];            // libreta completa (para el selector de ubicación)
  var MX_STATES = [];           // estados de MX; el API los manda (esto es respaldo por si falla)
  var SHIP_COST = 99;           // igual que ShopCatalog::SHIP_COST
  function token(){ try{ return localStorage.getItem("okstation.token") || ""; }catch(e){ return ""; } }
  function auth(){ var t = token(); return t ? { "Authorization": "Bearer " + t } : {}; }
  function shopUser(){ try{ return JSON.parse(localStorage.getItem("okstation.user")||"null"); }catch(e){ return null; } }
  /* Deja solo 10 dígitos (móvil MX). Quita la lada +52 si viene (12 dígitos). */
  function soloTel(v){ var d = String(v||"").replace(/\D/g,""); if (d.length===12 && d.slice(0,2)==="52") d=d.slice(2); return d.slice(0,10); }
  function loadMe(){
    if (!token()) return;
    fetch("backend/api/me.php", { headers: auth() }).then(function(r){ return r.json(); })
      .then(function(j){ if (j && j.ok) me = j.user; return fetch("backend/api/shop/addresses.php", { headers: auth() }); })
      .then(function(r){ return r ? r.json() : null; })
      .then(function(j){
        if (j && j.ok){
          locAddrs = j.addresses || [];
          if (j.states && j.states.length) MX_STATES = j.states;
          coAddr = locAddrs.filter(function(a){ return a.is_default; })[0] || locAddrs[0] || null;
        }
        renderLoc();
        if ($("tdCartDrawer").classList.contains("open")) renderCart();   // refresca si ya estaba abierto
      }).catch(function(){});
  }

  var $ = function(id){ return document.getElementById(id); };
  var mxn = function(n){ return "$" + (Math.round(n*100)/100).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2}); };
  var esc = function(s){ var d=document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML; };

  /* ═══ Carga de productos (paginada) ═══ */
  function load(reset){
    /* Una búsqueda/filtro NUEVO (reset) nunca se descarta: antes, si había una carga en
       vuelo, el `if (loading) return` se comía el reset y las filas viejas se quedaban
       (y el scroll seguía APILANDO encima los resultados de la búsqueda nueva). Las
       cargas de "más" (reset=false) sí respetan el candado. */
    if (reset){ page=1; done=false; $("tdRows").innerHTML=""; }
    else if (loading || done) return;
    var myToken = ++loadToken;   // invalida las respuestas que aún vengan en camino
    loading = true;
    $("tdState").textContent = page===1 ? "Cargando productos…" : "Cargando más…";
    $("tdState").style.display = "";

    var u = "backend/api/shop/products.php?per_page="+PER+"&page="+page
          + (q ? "&q="+encodeURIComponent(q) : "")
          + (cat ? "&category="+encodeURIComponent(cat) : "")
          + (fSubcats.length ? "&subcategory="+encodeURIComponent(fSubcats.join(",")) : "")
          + (fBrands.length ? "&brand="+encodeURIComponent(fBrands.join(",")) : "")
          + (fSort !== "name" ? "&sort="+encodeURIComponent(fSort) : "");

    fetch(u).then(function(r){ return r.json(); }).then(function(j){
      if (myToken !== loadToken) return;   // llegó tarde: ya hay una búsqueda más nueva
      loading = false;
      if (!j || !j.ok){ $("tdState").textContent = "No se pudo cargar el catálogo."; return; }
      pages = j.pages || 1;
      $("tdCount").textContent = j.total ? (j.total + (j.total===1?" producto":" productos")) : "";
      if (!j.items.length && page===1){
        $("tdState").textContent = q||cat ? "No encontramos nada con ese filtro." : "No hay productos.";
        done = true; return;
      }
      j.items.forEach(addRow);
      page++;
      /* Scroll infinito de VERDAD: al llegar al final, vuelve a empezar y repite los
         productos una y otra vez (como el "Todos" del e-commerce). Solo se corta en un
         tope de tarjetas para no crecer el DOM sin límite. */
      if (page > pages) { if ($("tdRows").children.length >= 600) done = true; else page = 1; }
      $("tdState").style.display = "none";
      /* El observador solo avisa cuando el centinela ENTRA. Si ya estaba a la vista
         (lista vacía al inicio, o una página que no llena el panel), no vuelve a
         avisar y el scroll se queda mudo. Por eso re-comprobamos al terminar. */
      setTimeout(maybeMore, 0);
    }).catch(function(){
      if (myToken !== loadToken) return;
      loading = false;
      $("tdState").textContent = "Error de conexión. Reintenta.";
    });
  }

  var byId = {};                // índice para resolver el producto al SOLTAR (drop trae solo el id)

  /* ── Favoritos por fila, vinculados a los deseados COMPARTIDOS (okstation_wishlist) ──
     Se leen los ids del localStorage (no de OKtienda.deseados(), que solo devuelve los
     que ya tiene hidratados en su caché y dejaría corazones apagados por error). */
  var HEART = '<svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg>';
  function wishIds(){ try{ var w = JSON.parse(localStorage.getItem("okstation_wishlist")||"[]"); return Array.isArray(w)?w.map(Number):[]; }catch(e){ return []; } }
  function isWished(id){ return wishIds().indexOf(+id) >= 0; }
  /* Repinta TODOS los corazones de la tabla (tras togglear o si cambian desde el panel). */
  function paintWishes(){
    var ids = wishIds();
    [].slice.call(document.querySelectorAll("#tdRows [data-wish]")).forEach(function(b){
      var on = ids.indexOf(+b.dataset.wish) >= 0;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.title = on ? "Quitar de favoritos" : "Guardar en favoritos";
    });
  }

  function addRow(p){
    byId[p.id] = p;
    var row = document.createElement("div");
    row.className = "td-row";
    row.draggable = true;                       // arrastrable al pre-carrito
    row.dataset.pid = p.id;
    var img = p.image ? '<div class="td-img" style="background-image:url('+encodeURI(p.image)+')"></div>' : '<div class="td-img td-noimg"></div>';
    var old = p.old ? '<span class="old">'+mxn(p.old)+'</span>' : '';
    row.innerHTML =
      img +
      '<div><div class="td-name">'+esc(p.name)+'</div><div class="td-meta">'+esc(p.brand||"")+(p.stock<=5?' · <b>solo '+p.stock+'</b>':'')+'</div></div>' +
      '<div class="td-price">'+old+mxn(p.price)+'</div>' +
      '<div style="text-align:right"><button class="td-add" data-add="'+p.id+'">+ Agregar</button></div>' +
      '<button class="td-wish'+(isWished(p.id)?' on':'')+'" data-wish="'+p.id+'" aria-pressed="'+(isWished(p.id)?'true':'false')+'" aria-label="Guardar en favoritos" title="'+(isWished(p.id)?'Quitar de favoritos':'Guardar en favoritos')+'">'+HEART+'</button>';
    row.querySelector("[data-add]").addEventListener("click", function(){ addToPre(p); });
    /* Tocar el RENGLÓN (imagen/nombre/precio) abre la vista previa — la misma
       información que en la tienda. Los botones (+ Agregar, ♥) siguen siendo suyos. */
    row.addEventListener("click", function(e){
      if (e.target.closest("[data-add],[data-wish]")) return;
      openPreview(p);
    });
    /* Favoritos: usa OKtienda.toggleDeseado (emite 'deseados', así el contador de la
       navbar y el panel se enteran). Si aún no cargó, cae a localStorage directo. */
    row.querySelector("[data-wish]").addEventListener("click", function(e){
      e.stopPropagation();
      var o = OK();
      if (o) o.toggleDeseado(p.id);
      else {
        var w = wishIds(), i = w.indexOf(+p.id);
        if (i >= 0) w.splice(i,1); else w.push(+p.id);
        try{ localStorage.setItem("okstation_wishlist", JSON.stringify(w)); }catch(err){}
      }
      paintWishes();
    });
    /* Arrastrar-y-soltar: alternativa al botón (que sigue siendo el camino principal
       y el único en táctil, donde el drag HTML5 no aplica). */
    row.addEventListener("dragstart", function(e){
      e.dataTransfer.setData("text/plain", String(p.id));
      e.dataTransfer.effectAllowed = "copy";
      row.classList.add("dragging");
      document.body.classList.add("td-dragging");   // resalta la zona de drop mientras arrastras
    });
    row.addEventListener("dragend", function(){
      row.classList.remove("dragging");
      document.body.classList.remove("td-dragging");
    });
    $("tdRows").appendChild(row);
  }

  /* ═══ Pre-carrito ═══ */
  var ADD_MS = 950;   // dura la confirmación antes de volver a "+ Agregar"

  function addToPre(p){
    var b = document.querySelector('[data-add="'+p.id+'"]');
    if (b && b.disabled) return;                               // está confirmando → ignora el clic
    var cur = pre[p.id] ? pre[p.id].qty : 0;
    if (cur >= p.stock){ btnTemp(b, "max", "Máximo"); return; } // ya no hay más piezas
    if (!pre[p.id]) pre[p.id] = { p:p, qty:0 };
    pre[p.id].qty++;
    renderPre(p.id);
    btnTemp(b, "done", '<span class="ck">✓</span> Agregado');
  }

  /* Pone el botón en un estado temporal (bloqueado mientras dura la animación) y
     lo regresa solo a "+ Agregar". Así no se puede agregar de más por doble clic. */
  function btnTemp(b, cls, html){
    if (!b) return;
    b.disabled = true;
    b.classList.add(cls);
    b.innerHTML = html;
    setTimeout(function(){
      b.classList.remove(cls);
      b.disabled = false;
      b.textContent = "+ Agregar";
    }, ADD_MS);
  }

  function chg(id, d){
    var it = pre[id]; if (!it) return;
    it.qty += d;
    if (it.qty <= 0) delete pre[id];
    else if (it.qty > it.p.stock) it.qty = it.p.stock;
    renderPre();
  }
  function totals(){
    var sub = 0, n = 0;
    for (var id in pre){ sub += pre[id].p.price * pre[id].qty; n += pre[id].qty; }
    /* Solo SUBTOTAL: el envío y el IVA por geo se calculan en el checkout de la tienda. */
    return { sub:sub, total:sub, n:n };
  }
  /* flashId (opcional): id del producto recién agregado → destella para ubicarlo. */
  function renderPre(flashId){
    var box = $("tdCItems"), keys = Object.keys(pre);
    if (!keys.length){
      box.innerHTML = '<div class="td-empty">Aún no agregas nada.<br>Busca y dale <b>+ Agregar</b>.</div>';
    } else {
      box.innerHTML = keys.map(function(id){
        var it = pre[id];
        var th = it.p.image ? '<div class="th" style="background-image:url('+encodeURI(it.p.image)+')"></div>' : '<div class="th td-noimg"></div>';
        return '<div class="td-ci" draggable="true" data-id="'+id+'">'+th+'<div><div class="nm">'+esc(it.p.name)+'</div>'+
               '<div class="pu">'+mxn(it.p.price)+' c/u</div></div>'+
               '<div class="td-qty"><button data-d="'+id+'" aria-label="Quitar uno">−</button>'+
               '<span>'+it.qty+'</span><button data-i="'+id+'" aria-label="Agregar uno">+</button></div></div>';
      }).join("");
      box.querySelectorAll("[data-i]").forEach(function(b){ b.addEventListener("click", function(){ chg(+b.dataset.i, 1); }); });
      box.querySelectorAll("[data-d]").forEach(function(b){ b.addEventListener("click", function(){ chg(+b.dataset.d, -1); }); });
      if (flashId != null){
        var el = box.querySelector('.td-ci[data-id="'+flashId+'"]');
        if (el){ el.classList.add("flash"); setTimeout(function(){ el.classList.remove("flash"); }, 800); }
      }
    }
    var t = totals();
    $("tdTotal").textContent = mxn(t.total);
    $("tdGo").disabled = t.n === 0;
    $("tdGo").textContent = t.n ? ("Enviar al carrito ("+t.n+")") : "Enviar al carrito";
  }

  /* La entrega (recoger/envío), el IVA por geo, el teléfono y la dirección se piden en
     el CHECKOUT de la tienda, no aquí: la compra rápida solo llena el carrito. */

  /* ═══ Enviar al carrito → abrir el panel para PAGAR aquí mismo ═══ */
  /* Fusiona el pre-carrito en el carrito compartido y abre el panel del carrito, donde
     está el checkout completo (envío, teléfono, pago). Todo sin salir de la compra rápida. */
  $("tdGo").addEventListener("click", function(){
    var t = totals();
    if (!t.n) return;
    var ids = Object.keys(pre);
    enviarAlCarrito();
    pre = {}; renderPre();                 // el pre-carrito ya pasó al carrito real
    /* enviarAlCarrito escribió localStorage directo; OKtienda no se enteró (su listener
       'storage' solo dispara entre pestañas). Un cambiar(id,0) lo obliga a re-hidratar
       el carrito desde el API y emitir 'carrito' → el panel se pinta completo. */
    var o = OK(); if (o && ids.length) o.cambiar(+ids[0], 0);
    renderCart();
    /* La lista del ASTRONAUTA va primero (decisión 21-jul): OKi detecta que el carrito
       creció y abre su lista solo; desde su "Ir a pagar →" se abre este panel del
       carrito. Antes se abrían LOS DOS a la vez y quedaban encimados. Si OKi no cargó
       (bloqueado/error), se abre el carrito directo como antes para no dejar el flujo
       sin salida. */
    if (!document.getElementById("oki-dock")) openDrawer($("tdCartDrawer"));
  });

  /* Fusiona el pre-carrito en el carrito COMPARTIDO, SUMANDO a lo que ya hubiera y sin
     pasarse del stock. NO sobrescribe: si el cliente ya tenía cosas en el carrito de la
     tienda, se conservan. */
  function enviarAlCarrito(){
    try{
      var c = JSON.parse(localStorage.getItem("okstation_cart") || "{}") || {};
      for (var id in pre){
        var cur = parseInt(c[id], 10) || 0;
        c[id] = Math.min(pre[id].p.stock, cur + pre[id].qty);
      }
      localStorage.setItem("okstation_cart", JSON.stringify(c));
    }catch(e){}
  }

  /* ═══ Categorías ═══ */
  $("tdCatBtn").addEventListener("click", function(){
    $("tdFilts").classList.remove("open"); $("tdFiltBtn").classList.remove("on"); $("tdFiltBtn").setAttribute("aria-expanded","false");
    var open = $("tdCats").classList.toggle("open");
    $("tdCatBtn").classList.toggle("on", open);
    $("tdCatBtn").setAttribute("aria-expanded", open ? "true" : "false");
  });
  fetch("backend/api/shop/categories.php").then(function(r){ return r.json(); }).then(function(j){
    if (!j || !j.ok) return;
    var row = $("tdCatsRow");
    var all = '<button class="td-chip on" data-cat="">Todos</button>';
    row.innerHTML = all + j.categories.map(function(c){
      return '<button class="td-chip" data-cat="'+esc(c.name)+'">'+esc(c.name)+'<span class="n">'+c.count+'</span></button>';
    }).join("");
    row.querySelectorAll("[data-cat]").forEach(function(b){
      b.addEventListener("click", function(){
        cat = b.dataset.cat;
        row.querySelectorAll("[data-cat]").forEach(function(x){ x.classList.toggle("on", x===b); });
        fBrandsLoaded = false;   // las marcas se acotan a la categoría → recargar al reabrir filtros
        /* El "Tipo" es propio de cada categoría: recargar y limpiar lo elegido. */
        fSubcatsLoaded = false; fSubcats = []; filtCount();
        tdSubQuery = ""; tdSubMore = false;   // búsquedas del panel: de cero en cada categoría
        tdBrandQuery = ""; tdBrandMore = false;
        load(true);
      });
    });
  }).catch(function(){});

  /* ═══ Filtros (marca + orden), dentro de la compra rápida ═══
     Filtra en el SERVIDOR (ver load): el catálogo se pagina, así que filtrar en el
     navegador solo miraría la página cargada. Aplica al instante, como las categorías. */
  var TD_SORTS = [["name","Nombre (A-Z)"],["price_asc","Precio: menor a mayor"],["price_desc","Precio: mayor a menor"],["newest","Más nuevos"]];
  function filtCount(){
    var n = fBrands.length + fSubcats.length + (fSort !== "name" ? 1 : 0);
    var el = $("tdFiltCount"); el.textContent = n; el.hidden = n === 0;
    $("tdFiltBtn").classList.toggle("on", $("tdFilts").classList.contains("open"));
  }
  function filtRender(){
    var orden = TD_SORTS.map(function(s){
      return '<label class="td-fopt"><input type="radio" name="tdsort" value="'+s[0]+'"'+(fSort===s[0]?" checked":"")+'>'+esc(s[1])+'</label>';
    }).join("");
    var tipos = fSubcatsLoaded
      ? (fSubcatList.length
          ? fSubcatList.map(function(s){
              return '<label class="td-fopt"><input type="checkbox" class="tdsubcat" value="'+esc(s.name)+'"'+(fSubcats.indexOf(s.name)>=0?" checked":"")+'>'+esc(s.name)+'<span class="n">'+s.count+'</span></label>';
            }).join("")
          : '<span class="n" style="color:var(--muted)">No hay tipos en esta categoría.</span>')
      : '<span class="n" style="color:var(--muted)">Cargando tipos…</span>';
    var marcas = fBrandsLoaded
      ? (fBrandList.length
          ? fBrandList.map(function(b){
              return '<label class="td-fopt"><input type="checkbox" class="tdbrand" value="'+esc(b.name)+'"'+(fBrands.indexOf(b.name)>=0?" checked":"")+'>'+esc(b.name)+'<span class="n">'+b.count+'</span></label>';
            }).join("")
          : '<span class="n" style="color:var(--muted)">No hay marcas en esta categoría.</span>')
      : '<span class="n" style="color:var(--muted)">Cargando marcas…</span>';
    /* Con ~80 tipos la lista era una pared: buscador + top 15 (el backend ya los manda
       ordenados por conteo) + "Ver todos". Se oculta con una CLASE (no re-render al
       teclear: se perdería el foco del buscador). */
    if (fSubcatsLoaded && fSubcatList.length > 15){
      tipos = '<input type="search" class="td-fsearch" placeholder="Buscar tipo… (tóner, papel, pluma)" aria-label="Buscar tipo">' +
              tipos + '<button type="button" class="td-fmore"></button>';
    }
    /* Marca: mismo tratamiento que Tipo (son ~70). */
    if (fBrandsLoaded && fBrandList.length > 15){
      marcas = '<input type="search" class="td-fbsearch" placeholder="Buscar marca… (HP, BIC, Crayola)" aria-label="Buscar marca">' +
               marcas + '<button type="button" class="td-fbmore"></button>';
    }
    $("tdFilts").innerHTML =
      '<div class="td-fgroup"><h4>Ordenar por</h4>'+orden+'</div>'+
      '<div class="td-fgroup td-fgroup--subs"><h4>Tipo</h4>'+tipos+'</div>'+
      '<div class="td-fgroup td-fgroup--brands"><h4>Marca</h4>'+marcas+'</div>';
    tdApplySubcatView();
    tdApplyBrandView();
  }
  var tdSubQuery = "", tdSubMore = false;
  function tdNorm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim(); }
  function tdApplySubcatView(){
    var box = $("tdFilts").querySelector(".td-fgroup--subs"); if (!box) return;
    var inp = box.querySelector(".td-fsearch");
    if (inp && inp.value !== tdSubQuery) inp.value = tdSubQuery;
    var q = tdNorm(tdSubQuery), TOP = 15, n = 0, total = 0;
    [].forEach.call(box.querySelectorAll(".td-fopt"), function(lb){
      var c = lb.querySelector(".tdsubcat"); if (!c) return;
      total++;
      var match = !q || tdNorm(c.value).indexOf(q) >= 0;
      var vis = match && (q ? true : (tdSubMore || n < TOP || c.checked));
      if (match) n++;
      lb.classList.toggle("is-hidden", !vis);
    });
    var more = box.querySelector(".td-fmore");
    if (more){ more.hidden = (!!q) || total <= TOP; more.textContent = tdSubMore ? "− Ver menos" : "+ Ver todos ("+total+")"; }
  }
  /* Marca: espejo de tdApplySubcatView. */
  var tdBrandQuery = "", tdBrandMore = false;
  function tdApplyBrandView(){
    var box = $("tdFilts").querySelector(".td-fgroup--brands"); if (!box) return;
    var inp = box.querySelector(".td-fbsearch");
    if (inp && inp.value !== tdBrandQuery) inp.value = tdBrandQuery;
    var q = tdNorm(tdBrandQuery), TOP = 15, n = 0, total = 0;
    [].forEach.call(box.querySelectorAll(".td-fopt"), function(lb){
      var c = lb.querySelector(".tdbrand"); if (!c) return;
      total++;
      var match = !q || tdNorm(c.value).indexOf(q) >= 0;
      var vis = match && (q ? true : (tdBrandMore || n < TOP || c.checked));
      if (match) n++;
      lb.classList.toggle("is-hidden", !vis);
    });
    var more = box.querySelector(".td-fbmore");
    if (more){ more.hidden = (!!q) || total <= TOP; more.textContent = tdBrandMore ? "− Ver menos" : "+ Ver todas ("+total+")"; }
  }
  function filtOpen(){
    $("tdCats").classList.remove("open"); $("tdCatBtn").classList.remove("on"); $("tdCatBtn").setAttribute("aria-expanded","false");
    var open = $("tdFilts").classList.toggle("open");
    $("tdFiltBtn").classList.toggle("on", open);
    $("tdFiltBtn").setAttribute("aria-expanded", open ? "true" : "false");
    if (!open) return;
    filtRender();
    var qs = cat ? "?category="+encodeURIComponent(cat) : "";
    if (!fBrandsLoaded){
      fetch("backend/api/shop/brands.php" + qs).then(function(r){ return r.json(); }).then(function(j){
        if (j && j.ok){ fBrandList = j.brands || []; fBrandsLoaded = true; filtRender(); }
      }).catch(function(e){ console.error("Filtros (marcas):", e); });
    }
    if (!fSubcatsLoaded){
      fetch("backend/api/shop/subcategories.php" + qs).then(function(r){ return r.json(); }).then(function(j){
        if (j && j.ok){ fSubcatList = j.subcategories || []; fSubcatsLoaded = true; filtRender(); }
      }).catch(function(e){ console.error("Filtros (tipos):", e); });
    }
  }
  $("tdFiltBtn").addEventListener("click", filtOpen);
  /* Buscadores y "ver todos" de tipos y marcas (delegados: el panel se repinta al llegar datos). */
  $("tdFilts").addEventListener("input", function(e){
    if (e.target.classList.contains("td-fsearch")){ tdSubQuery = e.target.value; tdApplySubcatView(); }
    if (e.target.classList.contains("td-fbsearch")){ tdBrandQuery = e.target.value; tdApplyBrandView(); }
  });
  $("tdFilts").addEventListener("click", function(e){
    if (e.target.closest(".td-fmore")){ tdSubMore = !tdSubMore; tdApplySubcatView(); }
    if (e.target.closest(".td-fbmore")){ tdBrandMore = !tdBrandMore; tdApplyBrandView(); }
  });
  /* Aplica al instante: cambiar orden o marca recarga la tabla. */
  $("tdFilts").addEventListener("change", function(e){
    if (e.target.name === "tdsort") fSort = e.target.value;
    else if (e.target.classList.contains("tdbrand")){
      fBrands = [].slice.call($("tdFilts").querySelectorAll(".tdbrand:checked")).map(function(c){ return c.value; });
    } else if (e.target.classList.contains("tdsubcat")){
      fSubcats = [].slice.call($("tdFilts").querySelectorAll(".tdsubcat:checked")).map(function(c){ return c.value; });
    } else return;
    filtCount(); load(true);
  });

  /* ═══ Buscador + autocompletado ═══
     Al escribir: (a) se filtra la tabla y (b) salen sugerencias abajo. Ambas usan el
     mismo endpoint, así que heredan la búsqueda con SINÓNIMOS del servidor
     (tinta↔cartucho, hojas↔papel…). Elegir una sugerencia filtra la tabla a ese producto.

     2026-07-21 — El desplegable de sugerencias queda APAGADO (TD_SUGERENCIAS=false):
     la tabla YA filtra en vivo con los mismos sinónimos, así que eran dos búsquedas a
     la vez y el menú tapaba justo los resultados que la tabla mostraba filtrados.
     El código se conserva completo: para revivirlo basta poner el flag en true. */
  var TD_SUGERENCIAS = false;
  var tmr = null, acTmr = null, acItems = [], acSel = -1, acToken = 0;

  function acClose(){
    var b = $("tdAc"); b.classList.remove("show"); b.innerHTML = "";
    acItems = []; acSel = -1; $("tdQ").setAttribute("aria-expanded", "false");
  }
  /* Resalta en el nombre lo que se tecleó (sin acentos, por término). */
  function acNorm(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
  function acHi(name, term){
    var terms = acNorm(term).split(/\s+/).filter(function(t){ return t.length >= 2; });
    for (var i=0;i<terms.length;i++){
      try{
        var re = new RegExp(terms[i].replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "i");
        var m = acNorm(name).match(re);
        if (m && m.index != null){
          return esc(name.slice(0,m.index)) + "<mark>" + esc(name.slice(m.index, m.index+m[0].length)) + "</mark>" + esc(name.slice(m.index+m[0].length));
        }
      }catch(e){}
    }
    return esc(name);
  }
  function acRender(term){
    if (!TD_SUGERENCIAS) return;   // desplegable apagado: la tabla es la única búsqueda
    var t = (term||"").trim();
    if (t.length < 2){ acClose(); return; }
    var token = ++acToken;
    fetch("backend/api/shop/products.php?per_page=7&page=1&q=" + encodeURIComponent(t))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (token !== acToken) return;                 // llegó tarde: ya se tecleó otra cosa
        var items = (j && j.ok && j.items) ? j.items : [];
        var box = $("tdAc");
        if (!items.length){
          box.innerHTML = '<div class="td-ac__none">No encontramos «' + esc(t) + '».<br>Prueba con otra palabra (marca o tipo).</div>';
          acItems = []; acSel = -1; box.classList.add("show"); return;
        }
        box.innerHTML = '<div class="td-ac__h">Sugerencias</div>' + items.map(function(p){
          var im = p.image ? '<span class="td-ac__im" style="background-image:url('+encodeURI(p.image)+')"></span>' : '<span class="td-ac__im td-noimg"></span>';
          return '<button type="button" class="td-ac__i" role="option" data-ac="'+esc(p.name)+'">'+im+
            '<span><span class="td-ac__nm">'+acHi(p.name,t)+'</span><br><span class="td-ac__mt">'+esc((p.brand?p.brand+" · ":"")+(p.category||""))+'</span></span>'+
            '<span class="td-ac__pr">'+mxn(p.price)+'</span></button>';
        }).join("");
        acItems = [].slice.call(box.querySelectorAll(".td-ac__i"));
        acSel = -1; box.classList.add("show"); $("tdQ").setAttribute("aria-expanded","true");
      }).catch(function(){});
  }
  /* Elegir una sugerencia: pone ese nombre en el buscador y filtra la tabla. */
  function acPick(nombre){
    $("tdQ").value = nombre; acClose();
    clearTimeout(tmr); q = nombre.trim(); load(true);
  }

  $("tdQ").addEventListener("input", function(){
    var v = $("tdQ").value;
    clearTimeout(tmr);
    /* 200 ms (antes 320): sin desplegable, la tabla es LA búsqueda y toma el papel
       ágil que tenían las sugerencias. load(true) ya maneja la carrera entre teclas. */
    tmr = setTimeout(function(){ q = v.trim(); load(true); }, 200);   // filtra la tabla
    if (TD_SUGERENCIAS){
      clearTimeout(acTmr);
      acTmr = setTimeout(function(){ acRender(v); }, 180);            // sugerencias (más ágil)
    }
  });
  $("tdQ").addEventListener("keydown", function(e){
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      if (!acItems.length) return;
      e.preventDefault();
      acSel = (acSel + (e.key === "ArrowDown" ? 1 : -1) + acItems.length) % acItems.length;
      acItems.forEach(function(el,i){ el.classList.toggle("sel", i===acSel); if (i===acSel) el.scrollIntoView({block:"nearest"}); });
    } else if (e.key === "Enter"){
      if (acSel >= 0 && acItems[acSel]){ e.preventDefault(); acPick(acItems[acSel].dataset.ac); }
      else acClose();
    } else if (e.key === "Escape"){ acClose(); }
  });
  $("tdAc").addEventListener("click", function(e){
    var it = e.target.closest("[data-ac]"); if (it) acPick(it.dataset.ac);
  });
  /* Clic fuera del buscador → cerrar sugerencias. */
  document.addEventListener("click", function(e){ if (!e.target.closest(".td-search")) acClose(); });

  /* ═══ Scroll infinito ═══
     ¿El centinela del fondo está a la vista (o casi)? → carga la siguiente página. */
  function maybeMore(){
    if (loading || done) return;
    var seR = $("tdSentinel").getBoundingClientRect();
    /* Fondo REALMENTE visible = el menor entre el borde de la caja interna (escritorio,
       max-height 62vh) y el alto de la ventana (móvil/≤980px, donde la caja crece y quien
       hace scroll es la PÁGINA). Sin esto, en móvil scR.bottom queda muy abajo y cargaba
       TODO de golpe en vez de poco a poco. */
    var visibleBottom = Math.min($("tdScroll").getBoundingClientRect().bottom, window.innerHeight);
    if (seR.top <= visibleBottom + 240) load(false);
  }
  /* Listener de scroll en vez de IntersectionObserver (el observador con `root` no
     resultó fiable). Se limita con setTimeout y NO con requestAnimationFrame: el rAF
     se congela en pestañas ocultas y el scroll se quedaría mudo al volver.
     Se escucha en el contenedor interno Y en la ventana (móvil scrollea la ventana). */
  var tick = false;
  function onScroll(){ if (tick) return; tick = true; setTimeout(function(){ tick = false; maybeMore(); }, 120); }
  $("tdScroll").addEventListener("scroll", onScroll, { passive: true });  // caja interna (escritorio)
  window.addEventListener("scroll", onScroll, { passive: true });          // la PÁGINA (móvil/≤980px)
  window.addEventListener("resize", maybeMore);

  /* ═══ Arrastrar productos al pre-carrito ═══
     El botón "+ Agregar" sigue siendo el camino principal (y el único en táctil).
     El drop reusa addToPre(), así que respeta el tope de stock y la animación. */
  (function(){
    var zone = document.querySelector(".td-cart");
    if (!zone) return;
    function allow(e){
      // Si arrastras DESDE el pre-carrito (para descartar), no resaltar la zona como
      // "soltar para agregar" (eso ponía el banner claro y el texto blanco desaparecía).
      if (document.body.classList.contains("td-predrag")) return;
      e.preventDefault(); e.dataTransfer.dropEffect = "copy"; zone.classList.add("td-drop-over");
    }
    zone.addEventListener("dragenter", allow);
    zone.addEventListener("dragover", allow);
    zone.addEventListener("dragleave", function(e){
      /* Solo apaga el resalte al salir de la zona de verdad (no al pasar sobre un hijo). */
      if (!zone.contains(e.relatedTarget)) zone.classList.remove("td-drop-over");
    });
    zone.addEventListener("drop", function(e){
      e.preventDefault();
      zone.classList.remove("td-drop-over");
      var id = e.dataTransfer.getData("text/plain");
      if (id.indexOf("pre:") === 0) return;   // eso viene del pre-carrito (descartar), no re-agregar
      var p = byId[id];
      if (p) addToPre(p);
    });
  })();

  /* ═══ Arrastrar DEL pre-carrito al bote → descartar ═══
     Complementa (no reemplaza) al botón − del pre-carrito. El dato se marca con "pre:" para
     distinguirlo de arrastrar un producto de la tabla (que agrega). */
  (function(){
    var items = $("tdCItems"), trash = $("tdTrash");
    if (!items || !trash) return;
    items.addEventListener("dragstart", function(e){
      var row = e.target.closest(".td-ci"); if (!row) return;
      e.dataTransfer.setData("text/plain", "pre:" + row.dataset.id);
      e.dataTransfer.effectAllowed = "move";
      row.classList.add("dragging");
      document.body.classList.add("td-predrag");   // muestra el bote
    });
    items.addEventListener("dragend", function(e){
      var row = e.target.closest(".td-ci"); if (row) row.classList.remove("dragging");
      document.body.classList.remove("td-predrag");
      trash.classList.remove("over");
      // Por si el resalte quedó puesto (el drop en el bote corta la propagación y el
      // "drop" de .td-cart no alcanza a quitarlo): asegurar que no se quede el banner claro.
      var z = document.querySelector(".td-drop-over"); if (z) z.classList.remove("td-drop-over");
    });
    function over(e){ e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect = "move"; trash.classList.add("over"); }
    trash.addEventListener("dragenter", over);
    trash.addEventListener("dragover", over);
    trash.addEventListener("dragleave", function(){ trash.classList.remove("over"); });
    trash.addEventListener("drop", function(e){
      e.preventDefault(); e.stopPropagation(); trash.classList.remove("over");
      var d = e.dataTransfer.getData("text/plain") || "";
      if (d.indexOf("pre:") === 0){ var id = d.slice(4); if (pre[id]){ delete pre[id]; renderPre(); } }
      /* renderPre() destruye la fila que se venia arrastrando, asi que su "dragend" ya no
         llega al listener de arriba y la marca td-predrag se quedaba PEGADA. Con ella puesta,
         allow() sale sin preventDefault() y el navegador deja de disparar "drop": despues de
         borrar una vez, ya no se podia arrastrar nada al carrito hasta recargar. */
      document.body.classList.remove("td-predrag");
      trash.classList.remove("over");
    });
    /* Red de seguridad: si un arrastre termina por cualquier otra via (soltar fuera, Escape,
       o con el elemento ya destruido), la marca no se queda pegada. */
    document.addEventListener("dragend", function(){ document.body.classList.remove("td-predrag"); });
  })();

  /* ═══ Carrito y Favoritos: paneles EN LA PÁGINA ═══
     Leen y mutan el MISMO localStorage que la tienda, vía window.OKtienda (shop-cart.js).
     Los contadores de la navbar ya los mantiene shop-header.js. Aquí solo pintamos el
     detalle y actuamos (cambiar cantidad, quitar, agregar a carrito). Para PAGAR se va al
     carrito de la tienda (ahí vive el checkout: sesión, dirección, IVA y pasarela). */
  function OK(){ return window.OKtienda || null; }   // shop-cart.js lo define (carga con defer)
  function anyDrawerOpen(){ return $("tdCartDrawer").classList.contains("open") || $("tdWishDrawer").classList.contains("open") || $("tdLocDrawer").classList.contains("open") || $("tdPrevDrawer").classList.contains("open"); }
  function closeDrawers(){
    ["tdCartDrawer","tdWishDrawer","tdLocDrawer","tdPrevDrawer"].forEach(function(id){
      $(id).classList.remove("open"); $(id).setAttribute("aria-hidden","true");
    });
    $("tdScrim").hidden = true;
    document.body.style.overflow = "";
  }

  /* ═══ Vista previa de producto (la misma información que la de la tienda) ═══
     Se abre al tocar el renglón. Pinta al instante con lo que ya hay en la fila y
     luego ENRIQUECE con product.php: galería, descripción, ficha técnica y —clave—
     el precio/stock/descuento FRESCOS de la BD (verificación al abrir). */
  function slugify(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80)||"producto"; }
  function pvStock(stock){
    var low=stock<=5;
    return '<div class="tdpv-stock" style="color:'+(stock<=0?"#c2410c":(low?"#c2410c":"#0E9F6E"))+'">'+
      (stock<=0?"Agotado por ahora":(low?"🔥 ¡Últimas "+stock+"!":stock+" disponibles")+" · Recoge en Otay o a domicilio")+'</div>';
  }
  /* El modal crece a 3 columnas cuando hay un panel lateral abierto (como la tienda). */
  function pv3Sync(){ $("tdPrevDrawer").classList.toggle("pv3", !$("tdpvDescP").hidden || !$("tdpvSpecsP").hidden); }
  $("tdPrevDrawer").addEventListener("click", function(e){
    var t=e.target.closest("[data-tdpv]");
    if(t){ $(t.dataset.tdpv==="specs"?"tdpvSpecsP":"tdpvDescP").hidden=false; pv3Sync(); return; }
    var c=e.target.closest("[data-pvside]");
    if(c){ $(c.dataset.pvside).hidden=true; pv3Sync(); }
  });

  var pvSeq=0;   // token anti-carrera: si abren A y luego B rápido, la respuesta tardía de A se descarta
  function openPreview(p){
    var myPv=++pvSeq;
    var body=$("tdPrevBody");
    body.innerHTML=
      '<div class="tdpv-img" id="tdpvImg"'+(p.image?' style="background-image:url('+encodeURI(p.image)+')"':'')+'></div>'+
      '<div class="tdpv-thumbs" id="tdpvThumbs"></div>'+
      '<div class="tdpv-meta">'+esc(p.brand||"")+(p.sku?' · SKU '+esc(p.sku):'')+(p.category?' · '+esc(p.category):'')+'</div>'+
      '<div class="tdpv-name">'+esc(p.name)+'</div>'+
      '<div class="tdpv-price" id="tdpvPrice">'+mxn(p.price)+(p.old?' <s>'+mxn(p.old)+'</s><span class="tdpv-save">Ahorras '+mxn(p.old-p.price)+'</span>':'')+'</div>'+
      '<div id="tdpvStock">'+pvStock(p.stock)+'</div>'+
      '<p class="tdpv-desc" id="tdpvDesc" hidden></p>'+
      '<button type="button" class="tdpv-full" id="tdpvDescBtn" data-tdpv="desc" hidden>Ver descripción completa →</button>'+
      '<ul class="tdpv-specs" id="tdpvSpecs"></ul>'+
      '<button type="button" class="tdpv-full" id="tdpvSpecsBtn" data-tdpv="specs" hidden>Ver ficha técnica completa →</button>'+
      '<button class="tdpv-add" id="tdpvAdd"'+(p.stock<=0?' disabled':'')+'>'+(p.stock<=0?'Agotado':'Agregar al carrito · '+mxn(p.price))+'</button>';
    $("tdpvAdd").addEventListener("click",function(){ if(p.stock>0){ addToPre(p); closeDrawers(); } });
    /* Paneles laterales (descripción/ficha) cerrados en cada apertura, como en la tienda. */
    $("tdpvDescP").hidden=true; $("tdpvSpecsP").hidden=true; pv3Sync();
    openDrawer($("tdPrevDrawer"));

    fetch("/backend/api/shop/product.php?id="+encodeURIComponent(p.id))
      .then(function(r){return r.json();})
      .then(function(j){
        if(myPv!==pvSeq) return;                 // ya se abrió otra vista previa
        if(!j||!j.ok||!j.product) return;
        var d=j.product;
        /* Galería (la primera imagen grande + miniaturas). */
        if(d.images&&d.images.length){
          var im=$("tdpvImg"); if(im) im.style.backgroundImage='url('+encodeURI(d.images[0])+')';
          if(d.images.length>1){
            var th=$("tdpvThumbs");
            if(th){ th.innerHTML=d.images.slice(0,5).map(function(u,i){
              return '<button type="button"'+(i===0?' class="on"':'')+' style="background-image:url('+encodeURI(u)+')" data-src="'+esc(u)+'" aria-label="Foto '+(i+1)+'"></button>';
            }).join("");
            th.addEventListener("click",function(e){ var b=e.target.closest("[data-src]"); if(!b)return;
              var im2=$("tdpvImg"); if(im2) im2.style.backgroundImage='url('+encodeURI(b.dataset.src)+')';
              [].forEach.call(th.querySelectorAll("button"),function(x){x.classList.toggle("on",x===b);}); }); }
          }
        }
        if(d.description){
          var full=String(d.description).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
          var de=$("tdpvDesc"); if(de){ de.textContent=full; de.hidden=false; }
          /* Panel IZQUIERDO: descripción completa + preguntas frecuentes (como la tienda). */
          var db2=$("tdpvDescB"); if(db2) db2.innerHTML='<p style="margin:0">'+esc(full)+'</p>'+
            '<div class="mfaq"><b>¿Incluye factura?</b><span>Sí, solicítala al pagar y te llega a tu correo.</span></div>'+
            '<div class="mfaq"><b>¿Cómo lo recibo?</b><span>Recógelo gratis en OK.station (Otay) o recíbelo a domicilio en todo México.</span></div>';
          var dbt=$("tdpvDescBtn"); if(dbt) dbt.hidden=false;
        }
        if(d.specs&&d.specs.length){
          var rows=d.specs.map(function(s){
            var n=(s&&s.name)||"", v=(s&&s.value)||"";
            return (n||v)?'<li><span class="sk">'+esc(n)+'</span><span class="sv">'+esc(v)+'</span></li>':""; });
          var ul=$("tdpvSpecs"); if(ul) ul.innerHTML=rows.slice(0,5).join("");
          /* Panel DERECHO: la ficha completa. El botón muestra cuántas specs hay. */
          var sb=$("tdpvSpecsB"); if(sb) sb.innerHTML='<ul class="tdpv-specs" style="margin:0">'+rows.join("")+'</ul>';
          var sbt=$("tdpvSpecsBtn"); if(sbt){ sbt.hidden=false; sbt.textContent="Ver ficha técnica completa ("+d.specs.length+") →"; }
        }
        /* Precio/stock/descuento frescos (la fila pudo envejecer). También se corrige
           la fila en memoria para que "+ Agregar" respete el stock real. */
        if(typeof d.price==="number"){
          var fOld=(d.old&&d.old>d.price)?d.old:null;
          p.price=d.price; p.stock=d.stock; p.old=fOld;
          var pr=$("tdpvPrice"); if(pr) pr.innerHTML=mxn(d.price)+(fOld?' <s>'+mxn(fOld)+'</s><span class="tdpv-save">Ahorras '+mxn(fOld-d.price)+'</span>':'');
          var stk=$("tdpvStock"); if(stk) stk.innerHTML=pvStock(d.stock);
          var ab=$("tdpvAdd"); if(ab){ ab.disabled=d.stock<=0; ab.textContent=d.stock<=0?"Agotado":"Agregar al carrito · "+mxn(d.price); }
        }
      }).catch(function(){});
  }
  function openDrawer(el){
    closeDrawers();
    $("tdScrim").hidden = false;
    el.classList.add("open"); el.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
  }

  function cartRow(it){
    var img = it.image ? '<span class="im" style="background-image:url('+encodeURI(it.image)+')"></span>' : '<span class="im td-noimg"></span>';
    return '<div class="td-di" data-id="'+it.id+'">'+img+
      '<div><div class="nm">'+esc(it.name)+'</div><div class="pu">'+mxn(it.price)+' c/u</div>'+
        '<div class="qty"><button data-cd="'+it.id+'" aria-label="Quitar uno">−</button><span>'+it.qty+'</span><button data-ci="'+it.id+'" aria-label="Agregar uno">+</button></div></div>'+
      '<div class="rgt"><div class="lt">'+mxn(it.price*it.qty)+'</div><button class="lnk del" data-crm="'+it.id+'">Quitar</button></div></div>';
  }
  function renderCart(){
    var o = OK(), items = o ? o.carrito() : [];
    if (!items.length){ $("tdCartBody").innerHTML = '<div class="td-dempty">Tu carrito está vacío.<br>Agrega productos y dale <b>Enviar al carrito</b>.</div>'; $("tdCartFoot").innerHTML = ""; return; }
    $("tdCartBody").innerHTML = items.map(cartRow).join("");

    /* ── Pie = CHECKOUT completo (se paga aquí, sin salir de la compra rápida) ── */
    var sub = o.total();
    if (!token()){
      $("tdCartFoot").innerHTML =
        '<div class="td-dtot"><span>Subtotal</span><span class="v">'+mxn(sub)+'</span></div>'+
        '<button type="button" class="td-dgo" data-cologin>Inicia sesión para pagar</button>'+
        '<div class="td-dnote">Necesitas una cuenta para pagar en línea.</div>';
      return;
    }
    var envio = coShip === "envio";
    var ship  = envio ? SHIP_COST : 0;
    var phone = soloTel((me && me.phone) || "");
    var addrOk = !envio || !!coAddr;
    var addrHtml = envio
      ? (coAddr
          ? '<div class="td-dnote" style="text-align:left;margin:0 0 10px"><b>Enviar a:</b> '+esc(coAddr.label || (coAddr.city+", "+coAddr.state))+'</div>'
          : '<div class="td-dnote" style="text-align:left;margin:0 0 10px;color:#c0342c">Agrega una dirección en <a href="perfil.html">tu cuenta</a> para envío.</div>')
      : '<div class="td-dnote" style="text-align:left;margin:0 0 10px">Recoges en OK.station · Centro Comercial Otay</div>';

    $("tdCartFoot").innerHTML =
      '<div class="co-ship">'+
        '<button type="button" data-coship="retiro" class="'+(envio?'':'on')+'">Recoger · Gratis</button>'+
        '<button type="button" data-coship="envio" class="'+(envio?'on':'')+'">Envío · '+mxn(SHIP_COST)+'</button>'+
      '</div>'+
      addrHtml+
      '<label class="co-lbl" for="coPhone">WhatsApp para avisarte</label>'+
      '<input class="co-phone" id="coPhone" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="6640000000" value="'+esc(phone)+'">'+
      '<div class="td-dtot" style="margin-top:12px"><span>Total'+(envio?' (+ envío)':'')+'</span><span class="v">'+mxn(sub+ship)+'</span></div>'+
      '<button type="button" class="td-dgo" id="coPay"'+(addrOk?'':' disabled')+'>Pagar '+mxn(sub+ship)+'</button>'+
      '<div class="td-dnote">IVA incluido · pago seguro con Mercado Pago</div>'+
      '<div class="co-msg" id="coMsg"></div>';
  }

  /* Crea el pedido desde el carrito COMPARTIDO y va a pago.html (misma pasarela que la
     tienda). El servidor recalcula precios, IVA por geo y stock: no confía en el cliente. */
  function doCheckout(){
    var o = OK(); if (!o) return;
    var msg = $("coMsg"); if (msg){ msg.textContent = ""; }
    function bad(m){ if (msg){ msg.textContent = m; } }
    var phone = soloTel($("coPhone") && $("coPhone").value);
    if (phone.length !== 10) return bad("Ingresa un WhatsApp válido (10 dígitos).");
    var envio = coShip === "envio";
    if (envio && !coAddr) return bad("Agrega una dirección de envío en tu cuenta.");
    /* seen_unit = precio de LISTA que el carrito mostró; el servidor bloquea si el
       vigente difiere >3% (deriva por sync de Exel) y manda los precios nuevos. */
    var items = o.carrito().map(function(it){ return { id: it.id, qty: it.qty, seen_unit: +it.price || 0 }; });
    if (!items.length) return bad("Tu carrito está vacío.");
    var body = { items: items, ship_mode: coShip, contact_phone: phone };
    if (envio){
      body.ship_address = [coAddr.street, coAddr.ext_num, coAddr.int_num, coAddr.neighborhood, coAddr.city, coAddr.state, "CP " + coAddr.postal_code].filter(Boolean).join(", ");
      body.state = coAddr.state;   // define el IVA (8% BC / 16% nacional)
    }
    var btn = $("coPay"); if (btn){ btn.disabled = true; btn.textContent = "Procesando…"; }
    fetch("backend/api/shop/create.php", { method:"POST", headers: Object.assign({ "Content-Type":"application/json" }, auth()), body: JSON.stringify(body) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j && j.ok && j.order){
          try{ localStorage.removeItem("okstation_cart"); }catch(e){}
          location.href = "pago.html?shop=" + j.order.id;
          return;
        }
        if (btn){ btn.disabled = false; }
        if (j && j.price_changed){
          /* Los precios de esta página viven en la caché de shop-cart.js: la forma
             honesta de repintar TODO con los vigentes es recargar. El mensaje se
             muestra primero para que el cliente sepa por qué. */
          bad((j.error) || "Los precios cambiaron; el carrito se va a actualizar.");
          setTimeout(function(){ location.reload(); }, 2600);
          return;
        }
        bad((j && j.error) || "No se pudo crear el pedido."); renderCart();
      }).catch(function(){ if (btn){ btn.disabled = false; } bad("Error de conexión. Reintenta."); });
  }
  function wishRow(it){
    var img = it.image ? '<span class="im" style="background-image:url('+encodeURI(it.image)+')"></span>' : '<span class="im td-noimg"></span>';
    return '<div class="td-di" data-id="'+it.id+'">'+img+
      '<div><div class="nm">'+esc(it.name)+'</div><div class="pu">'+mxn(it.price)+'</div></div>'+
      '<div class="rgt"><button class="lnk" data-wadd="'+it.id+'">Agregar</button><button class="lnk del" data-wrm="'+it.id+'">Quitar</button></div></div>';
  }
  function renderWish(){
    var o = OK(), items = o ? o.deseados() : [];
    $("tdWishBody").innerHTML = items.length
      ? items.map(wishRow).join("")
      : '<div class="td-dempty">No tienes favoritos todavía.<br>Marca el ❤ en un producto desde la tienda.</div>';
  }

  /* stopImmediatePropagation: shop-header.js (compartido) también engancha .tb-cart/.tb-fav
     y abre SUS paneles, cuyo "Finalizar compra" va a /tienda#cart (la tienda normal). Aquí
     queremos PAGAR en la página, así que bloqueamos su handler. El nuestro se registra antes
     (script inline vs. defer), así que corta el suyo. */
  $("tdCartNavBtn").addEventListener("click", function(e){ e.preventDefault(); e.stopImmediatePropagation(); renderCart(); openDrawer($("tdCartDrawer")); });
  $("tdFavBtn").addEventListener("click", function(e){ e.preventDefault(); e.stopImmediatePropagation(); renderWish(); openDrawer($("tdWishDrawer")); });
  $("tdScrim").addEventListener("click", closeDrawers);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && anyDrawerOpen()) closeDrawers(); });
  document.querySelectorAll("[data-dclose]").forEach(function(b){ b.addEventListener("click", closeDrawers); });

  /* Acciones dentro de los paneles (delegadas: el contenido se vuelve a pintar). */
  $("tdCartDrawer").addEventListener("click", function(e){
    /* Checkout: login / cambiar envío / pagar (no requieren OKtienda para el ítem). */
    if (e.target.closest("[data-cologin]")){ location.href = "cuenta.html?next=" + encodeURIComponent("tienda-dinamica.html"); return; }
    var sh = e.target.closest("[data-coship]"); if (sh){ coShip = sh.dataset.coship; renderCart(); return; }
    if (e.target.closest("#coPay")){ doCheckout(); return; }
    /* Ítems del carrito: +/− y quitar. */
    var o = OK(); if (!o) return;
    var t = e.target.closest("[data-ci],[data-cd],[data-crm]"); if (!t) return;
    if (t.hasAttribute("data-ci")) o.cambiar(+t.dataset.ci, 1);
    else if (t.hasAttribute("data-cd")) o.cambiar(+t.dataset.cd, -1);
    else if (t.hasAttribute("data-crm")) o.quitar(+t.dataset.crm);
    renderCart();   // re-pinta YA: el localStorage se actualiza en el acto (no esperar al evento)
  });
  /* Teléfono: solo 10 dígitos mientras se escribe (delegado; el pie se re-pinta). */
  $("tdCartDrawer").addEventListener("input", function(e){
    if (e.target.id !== "coPhone") return;
    var limpio = soloTel(e.target.value);
    if (e.target.value !== limpio) e.target.value = limpio;
  });
  $("tdWishDrawer").addEventListener("click", function(e){
    var o = OK(); if (!o) return;
    var t = e.target.closest("[data-wadd],[data-wrm]"); if (!t) return;
    if (t.hasAttribute("data-wadd")) o.agregar(+t.dataset.wadd, 1);   // pasa de favorito a carrito
    else if (t.hasAttribute("data-wrm")) o.toggleDeseado(+t.dataset.wrm);
    /* Re-pinta YA. Clave: agregar() saca el item de favoritos pero solo emite el evento
       'carrito', NO 'deseados' → sin esto el panel mostraría un favorito fantasma y
       "Quitar" volvería a agregarlo. */
    renderWish();
  });
  /* OKtienda avisa cuando cambia el carrito/deseados (misma pestaña) → re-pintar si el
     panel está abierto. shop-header ya actualiza los contadores por su cuenta. */
  window.addEventListener("oktienda:carrito", function(){
    if ($("tdCartDrawer").classList.contains("open")) renderCart();
    /* 'carrito' también: agregar() gradúa un favorito al carrito (lo saca de deseados)
       pero solo emite este evento → hay que repintar los corazones de la tabla. */
    paintWishes();
  });
  window.addEventListener("oktienda:deseados", function(){
    if ($("tdWishDrawer").classList.contains("open")) renderWish();
    paintWishes();
  });
  /* Si cambian los deseados en OTRA pestaña. */
  window.addEventListener("storage", function(e){ if (e.key === "okstation_wishlist") paintWishes(); });

  /* ═══ Ubicación de entrega: libreta de direcciones EN LA PÁGINA ═══
     Mismas direcciones y endpoints que la tienda (tabla user_addresses). La barra
     muestra la PREDETERMINADA; elegir/agregar aquí actualiza coAddr, así el checkout
     del carrito usa la dirección elegida. */
  function authFetch(url, opts){
    opts = opts || {}; opts.headers = Object.assign({ "Content-Type":"application/json" }, auth(), opts.headers||{});
    return fetch(url, opts).then(function(r){ return r.json(); });
  }
  function renderLoc(){
    var b = $("locMain"), t = $("locTop"); if (!b) return;
    var d = token() ? coAddr : null;
    if (d){ t.hidden = false; t.textContent = "Entrega en"; b.textContent = d.city + " " + d.postal_code; }
    else { t.hidden = true; b.textContent = "Elige tu ubicación"; }
  }
  function openLoc(){
    /* Sin sesión no hay dónde guardar → a iniciar sesión y volver a la compra rápida. */
    if (!token()){ location.href = "cuenta.html?next=" + encodeURIComponent("tienda-dinamica.html"); return; }
    $("tdLocTitle").textContent = "¿A dónde te lo enviamos?";
    $("tdLocBody").innerHTML = '<div class="td-dempty">Cargando tus direcciones…</div>';
    openDrawer($("tdLocDrawer"));
    authFetch("backend/api/shop/addresses.php").then(function(j){
      if (!j || !j.ok) return locList([]);
      locAddrs = j.addresses || []; if (j.states && j.states.length) MX_STATES = j.states;
      coAddr = locAddrs.filter(function(a){ return a.is_default; })[0] || locAddrs[0] || null;
      renderLoc();
      locAddrs.length ? locList(locAddrs) : locForm();   // sin direcciones → directo al alta
    }).catch(function(e){ console.error("Direcciones:", e); locList([]); });
  }
  function locList(list){
    $("tdLocTitle").textContent = "¿A dónde te lo enviamos?";
    var items = list.map(function(a){
      return '<button type="button" class="addr'+(a.is_default?" addr--on":"")+'" data-addr="'+a.id+'">'+
        '<b>'+esc(a.recipient)+(a.is_default?' <span class="addr__tag">Predeterminada</span>':'')+'</b>'+
        '<span>'+esc(a.label || (a.city+" "+a.postal_code))+'</span>'+
        (a.notes?'<span class="addr__note">'+esc(a.notes)+'</span>':'')+'</button>';
    }).join("");
    $("tdLocBody").innerHTML =
      '<div class="loc-err" id="locErr" role="alert" hidden></div>'+
      (list.length?'<p class="td-dnote" style="text-align:left;margin:0 0 12px">Elige a dónde enviamos tu pedido.</p>':'')+
      '<div class="addrs">'+items+
        '<button type="button" class="addr addr--new" id="addrNew"><span class="addr__plus">+</span><b>Agregar dirección</b></button>'+
      '</div>';
  }
  function locForm(){
    $("tdLocTitle").textContent = "Agregar una dirección";
    var u = shopUser() || {};
    var opts = MX_STATES.map(function(s){ return '<option'+(s==="Baja California"?' selected':'')+'>'+esc(s)+'</option>'; }).join("");
    var hayPrevias = (locAddrs||[]).length > 0;
    $("tdLocBody").innerHTML =
      '<div class="loc-err" id="locErr" role="alert" hidden></div>'+
      '<div class="af-field"><label for="afRec">¿Quién recibe?</label><input id="afRec" type="text" maxlength="160" autocomplete="name" placeholder="Nombre y apellido" value="'+esc(u.full_name||"")+'"></div>'+
      '<div class="af-field"><label for="afPhone">Teléfono</label><input id="afPhone" type="tel" maxlength="40" inputmode="tel" autocomplete="tel" placeholder="664 719 4117" value="'+esc(u.phone||"")+'"></div>'+
      '<div class="af-field"><label for="afStreet">Calle</label><input id="afStreet" type="text" maxlength="200" autocomplete="address-line1" placeholder="Blvd. Insurgentes"></div>'+
      '<div class="afrow"><div class="af-field"><label for="afExt">Núm. exterior</label><input id="afExt" type="text" maxlength="30" placeholder="123"></div>'+
        '<div class="af-field"><label for="afInt">Interior <span class="afopt">(opcional)</span></label><input id="afInt" type="text" maxlength="30" placeholder="4B"></div></div>'+
      '<div class="af-field"><label for="afCol">Colonia</label><input id="afCol" type="text" maxlength="160" autocomplete="address-line2" placeholder="Otay Constituyentes"></div>'+
      '<div class="afrow"><div class="af-field"><label for="afCity">Ciudad</label><input id="afCity" type="text" maxlength="120" autocomplete="address-level2" placeholder="Tijuana" value="Tijuana"></div>'+
        '<div class="af-field"><label for="afCp">Código postal</label><input id="afCp" type="text" inputmode="numeric" maxlength="5" autocomplete="postal-code" placeholder="22204"></div></div>'+
      '<div class="af-field"><label for="afState">Estado</label><select id="afState" autocomplete="address-level1">'+opts+'</select></div>'+
      '<div class="af-field"><label for="afNotes">Referencias <span class="afopt">(opcional)</span></label><input id="afNotes" type="text" maxlength="255" placeholder="Casa azul, portón negro, entre X y Y"></div>'+
      '<label class="afchk"><input type="checkbox" id="afDef"'+(hayPrevias?'':' checked disabled')+'> Usar como mi dirección predeterminada'+(hayPrevias?'':' <span class="afopt">(es tu primera dirección)</span>')+'</label>'+
      '<button type="button" class="afsave" id="afSave">Agregar dirección</button>'+
      (hayPrevias?'<button type="button" class="afback" id="afBack">← Volver a mis direcciones</button>':'');
    setTimeout(function(){ var f=$("afRec"); if(f)f.focus(); }, 50);
  }
  function saveAddr(){
    var err = $("locErr"); function bad(m){ if(err){ err.textContent=m; err.hidden=false; err.scrollIntoView({block:"nearest"}); } }
    var v = function(id){ return ($(id).value||"").trim(); };
    var body = { recipient:v("afRec"), phone:v("afPhone"), street:v("afStreet"), ext_num:v("afExt"),
                 int_num:v("afInt"), neighborhood:v("afCol"), city:v("afCity"), state:v("afState"),
                 postal_code:v("afCp"), notes:v("afNotes"), is_default:$("afDef").checked };
    if (body.recipient.length < 3)                 return bad("Escribe el nombre de quien recibe.");
    if ((body.phone.match(/\d/g)||[]).length < 10) return bad("El teléfono debe tener al menos 10 dígitos.");
    if (!body.street)                              return bad("Escribe la calle.");
    if (!body.ext_num)                             return bad("Escribe el número exterior.");
    if (!body.neighborhood)                        return bad("Escribe la colonia.");
    if (!body.city)                                return bad("Escribe la ciudad.");
    if (!/^\d{5}$/.test(body.postal_code))         return bad("El código postal debe tener 5 dígitos.");
    var btn = $("afSave"); btn.disabled = true; btn.textContent = "Guardando…";
    authFetch("backend/api/shop/address-save.php", { method:"POST", body:JSON.stringify(body) }).then(function(j){
      if (!j || !j.ok){ btn.disabled=false; btn.textContent="Agregar dirección"; return bad((j&&j.error)||"No se pudo guardar."); }
      locAddrs = j.addresses || [];
      coAddr = locAddrs.filter(function(a){ return a.is_default; })[0] || locAddrs[0] || null;
      renderLoc(); closeDrawers();
      if ($("tdCartDrawer").classList.contains("open")) renderCart();
    }).catch(function(){ btn.disabled=false; btn.textContent="Agregar dirección"; bad("Sin conexión con el servidor."); });
  }
  function pickAddr(id){
    authFetch("backend/api/shop/address-default.php", { method:"POST", body:JSON.stringify({ id:id }) }).then(function(j){
      if (!j || !j.ok) return;
      locAddrs = j.addresses || [];
      coAddr = locAddrs.filter(function(a){ return a.is_default; })[0] || locAddrs[0] || null;
      renderLoc(); closeDrawers();
      if ($("tdCartDrawer").classList.contains("open")) renderCart();
    }).catch(function(){});
  }
  $("tdLocBtn").addEventListener("click", openLoc);
  $("tdLocDrawer").addEventListener("click", function(e){
    if (e.target.closest("#addrNew")) return locForm();
    if (e.target.closest("#afBack"))  return locList(locAddrs||[]);
    if (e.target.closest("#afSave"))  return saveAddr();
    var a = e.target.closest("[data-addr]"); if (a) return pickAddr(+a.dataset.addr);
  });
  $("tdLocDrawer").addEventListener("keydown", function(e){
    if (e.key === "Enter" && e.target.tagName === "INPUT" && $("afSave")){ e.preventDefault(); saveAddr(); }
  });

  /* ═══ Arranque ═══ */
  /* OKi (astronauta): su botón "Ir a pagar" llama OKtienda.abrirCarrito(), que por
     defecto navega a la tienda normal (/tienda#store). Aquí lo redirigimos al carrito
     EN LA PÁGINA (con su checkout), y cerramos el panel de OKi (queda por encima).
     OKtienda lo define shop-cart.js (defer, corre después), así que esperamos a que exista. */
  function hookOkiPay(){
    if (!window.OKtienda) return false;
    window.OKtienda.abrirCarrito = function(){
      var p = document.querySelector(".oki-panel"); if (p) p.classList.remove("on");   // cerrar OKi (z-index mayor)
      renderCart(); openDrawer($("tdCartDrawer"));
    };
    return true;
  }
  if (!hookOkiPay()){
    var okiIv = setInterval(function(){ if (hookOkiPay()) clearInterval(okiIv); }, 60);
    setTimeout(function(){ clearInterval(okiIv); }, 6000);
  }

  renderPre(); load(true); renderLoc(); loadMe();   // loadMe() ya trae la dirección y pinta el chip
})();
</script>
<!-- Barra del e-commerce: puente del carrito (shop-cart) + comportamiento (shop-header). -->
<script src="assets/shop-cart.js?v=20260717a" defer></script>
<script src="assets/shop-header.js?v=20260717f" defer></script>
<script src="assets/session-nav.js?v=20260716a" defer></script>
<!-- OKi (astronauta): se auto-inyecta. Va DESPUÉS de shop-cart.js, que define
     window.OKtienda (el puente del carrito/deseados compartido que OKi lee). -->
<script src="assets/oki.js?v=20260717d" defer></script>
</body>
