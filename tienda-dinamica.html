<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compra rápida | Ok.station</title>
<meta name="description" content="Arma tu pedido de papelería en segundos: busca, agrega y paga. Compra rápida de Ok.station.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="assets/shop-header.css?v=20260716a">
<link rel="stylesheet" href="assets/oki.css?v=20260716d">
<style>
/* ══════════════════════════════════════════════════════════════════
   Tienda dinámica (compra rápida) — vista de tabla + pre-carrito.
   Pensada para pedidos grandes: buscar, agregar y pagar sin navegar.
   Reusa las variables de marca de styles.css (no inventa colores).
   ══════════════════════════════════════════════════════════════════ */
.td-wrap{max-width:1240px;margin:0 auto;padding:18px 16px 60px}

/* La navbar sin buscador: el spacer ocupa el hueco central (logo izq, acciones der). */
.shopbar__spacer{flex:1 1 auto}
/* ── Barra superior: buscador + categorías + filtros ── */
.td-top{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-bottom:14px}
.td-search{position:relative}
.td-search input{
  width:100%;height:52px;border-radius:999px;border:1px solid var(--line,#e3e6ee);
  background:#fff;padding:0 18px 0 48px;font:inherit;font-size:.98rem;color:var(--ink,#111);
  box-shadow:0 1px 2px rgba(16,24,40,.04);transition:border-color .15s,box-shadow .15s}
.td-search input:focus{outline:none;border-color:var(--brand-blue,#066CFF);box-shadow:0 0 0 4px rgba(6,108,255,.12)}
.td-search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--muted,#667085);pointer-events:none}
.td-catbtn{
  height:52px;padding:0 20px;border-radius:999px;border:0;cursor:pointer;
  background:var(--grad-brand);color:#fff;font:inherit;font-weight:700;font-size:.92rem;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  box-shadow:0 4px 14px rgba(6,108,255,.22);transition:transform .12s,box-shadow .12s}
.td-catbtn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(6,108,255,.3)}
.td-catbtn .chev{transition:transform .18s}
.td-catbtn.on .chev{transform:rotate(180deg)}

/* Panel de categorías */
.td-cats{
  display:none;background:#fff;border:1px solid var(--line,#e3e6ee);border-radius:16px;
  padding:12px;margin-bottom:14px;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.td-cats.open{display:block}
.td-cats .row{display:flex;flex-wrap:wrap;gap:8px}
.td-chip{
  border:1px solid var(--line,#e3e6ee);background:#fff;color:var(--ink,#111);
  border-radius:999px;padding:8px 14px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;
  transition:all .14s}
.td-chip:hover{border-color:var(--brand-blue,#066CFF);color:var(--brand-blue,#066CFF)}
.td-chip.on{background:var(--grad-brand);border-color:transparent;color:#fff}
.td-chip .n{opacity:.65;font-weight:500;margin-left:5px;font-size:.78rem}
/* Botón de Filtros: secundario (contorno), para no competir con Categorías. */
.td-filtbtn{background:#fff !important;color:var(--ink,#111) !important;border:1.5px solid var(--line,#e3e6ee) !important;box-shadow:0 1px 2px rgba(16,24,40,.04) !important}
.td-filtbtn:hover{border-color:var(--brand-blue,#066CFF) !important}
.td-filtbtn .fct{background:var(--brand-blue,#066CFF);color:#fff;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;font-size:.72rem;font-weight:800;padding:0 5px}
/* Panel de filtros (reusa .td-cats como contenedor). */
.td-fgroup{padding:4px 2px 12px;border-bottom:1px solid var(--line,#eef1f6)}
.td-fgroup:last-child{border-bottom:0;padding-bottom:2px}
.td-fgroup h4{margin:0 0 8px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted,#667085)}
.td-fopt{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;margin:0 6px 6px 0;border:1px solid var(--line,#e3e6ee);border-radius:999px;font-size:.85rem;font-weight:600;cursor:pointer}
.td-fopt input{accent-color:var(--brand-blue,#066CFF);margin:0}
.td-fopt:hover{border-color:var(--brand-blue,#066CFF)}
.td-fopt .n{opacity:.6;font-weight:500;font-size:.78rem}
/* ── Paneles de carrito / favoritos (cajón derecho, en la página) ── */
.td-scrim{position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:70}
.td-drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,92vw);background:#fff;z-index:71;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  box-shadow:-14px 0 44px rgba(16,24,40,.22)}
.td-drawer.open{transform:translateX(0)}
/* Favoritos y Dirección: MODAL CENTRADO (como la tienda normal), no cajón lateral.
   Solo cambia el posicionamiento; su estructura (encabezado + cuerpo) y su JS no cambian.
   El carrito se queda como cajón (lleva el checkout, mejor a lo alto). */
#tdWishDrawer,#tdLocDrawer{
  top:50%;left:50%;right:auto;bottom:auto;height:auto;max-height:88vh;width:min(460px,92vw);
  border-radius:22px;overflow:hidden;box-shadow:0 26px 74px rgba(16,24,40,.28);
  transform:translate(-50%,-50%) scale(.96);opacity:0;visibility:hidden;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),opacity .18s,visibility .2s}
#tdWishDrawer.open,#tdLocDrawer.open{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible}
.td-dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line,#e3e6ee);font-size:1.05rem}
.td-dx{width:34px;height:34px;border:0;background:var(--paper,#f4f6fa);border-radius:50%;font-size:1.2rem;line-height:1;cursor:pointer;color:var(--muted,#667085)}
.td-dx:hover{background:#e9edf5}
.td-dbody{flex:1 1 auto;overflow-y:auto;padding:12px 14px}
.td-dfoot{flex:none;border-top:1px solid var(--line,#e3e6ee);padding:14px 16px}
.td-dempty{text-align:center;color:var(--muted,#667085);font-size:.9rem;padding:40px 12px}
.td-di{display:grid;grid-template-columns:46px 1fr auto;gap:11px;align-items:center;padding:10px 4px;border-bottom:1px solid #f1f3f8}
.td-di:last-child{border-bottom:0}
.td-di .im{width:46px;height:46px;border-radius:8px;background:#f4f6fa center/contain no-repeat;border:1px solid var(--line,#e3e6ee)}
.td-di .nm{font-size:.86rem;font-weight:600;line-height:1.2}
.td-di .pu{font-size:.78rem;color:var(--muted,#667085);margin-top:2px}
.td-di .qty{display:inline-flex;align-items:center;gap:8px;margin-top:5px}
.td-di .qty button{width:24px;height:24px;border:1px solid var(--line,#e3e6ee);background:#fff;border-radius:6px;cursor:pointer;font-weight:700;line-height:1}
.td-di .rgt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.td-di .lt{font-size:.86rem;font-weight:700}
.td-di .lnk{border:0;background:none;color:var(--brand-blue,#066CFF);font:inherit;font-size:.78rem;font-weight:600;cursor:pointer;padding:0}
.td-di .lnk.del{color:#c0342c}
.td-dtot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-weight:800}
.td-dtot .v{font-size:1.15rem}
.td-dgo{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--grad-brand);color:#fff;font:inherit;font-weight:800;font-size:.95rem;cursor:pointer;text-align:center;text-decoration:none}
.td-dnote{text-align:center;font-size:.76rem;color:var(--muted,#667085);margin-top:8px}
/* Checkout dentro del panel de carrito */
.co-ship{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.co-ship button{padding:10px 8px;border:1.5px solid var(--line,#e3e6ee);background:#fff;border-radius:10px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--ink,#111)}
.co-ship button.on{border-color:var(--brand-blue,#066CFF);background:var(--brand-blue-light,#EAF1FF);color:var(--brand-blue,#066CFF)}
.co-lbl{display:block;font-size:.78rem;font-weight:700;margin-bottom:5px}
.co-phone{width:100%;height:44px;border:1.5px solid var(--line,#e3e6ee);border-radius:10px;padding:0 14px;font:inherit;font-size:.95rem;background:#fff;color:var(--ink,#111)}
.co-phone:focus{outline:none;border-color:var(--brand-blue,#066CFF);box-shadow:0 0 0 3px rgba(6,108,255,.14)}
.co-msg{color:#c0342c;font-size:.82rem;text-align:center;margin-top:8px;min-height:1em}
/* ── Ubicación de entrega: botón de la navbar + libreta en el cajón ── */
.tb-loc{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border:1.5px solid transparent;border-radius:12px;background:none;color:#fff;cursor:pointer;text-align:left;max-width:190px;transition:border-color .15s,background .15s}
.tb-loc:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5)}
.tb-loc:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tb-loc svg{width:17px;height:17px;flex:none;color:#fff}
.tb-loc__txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.tb-loc small{font-size:.68rem;color:rgba(255,255,255,.75);font-weight:600}
.tb-loc b{font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){ .tb-loc__txt{display:none} .tb-loc{padding:9px 10px} }
/* Libreta (lista de direcciones) */
.loc-err{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#fdeaea;color:#8a1c1c;font-size:.85rem}
.addrs{display:flex;flex-direction:column;gap:9px}
.addr{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line,#e3e6ee);border-radius:12px;background:#fff;cursor:pointer;font:inherit;color:var(--ink,#111);transition:border-color .15s,box-shadow .15s}
.addr:hover{border-color:var(--brand-blue,#066CFF);box-shadow:0 6px 18px rgba(8,12,30,.10)}
.addr--on{border-color:var(--brand-blue,#066CFF);background:#f5f9ff}
.addr b{font-size:.9rem;font-weight:700}
.addr span{font-size:.82rem;color:var(--muted,#667085)}
.addr__note{font-style:italic}
/* .addr .addr__tag (no solo .addr__tag): si no, la regla .addr span de arriba —más
   específica— le gana y el texto sale gris en vez de blanco. */
.addr .addr__tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--brand-blue,#066CFF);color:#fff;font-size:.64rem;font-weight:800;vertical-align:middle}
.addr--new{flex-direction:row;align-items:center;gap:9px;border-style:dashed;justify-content:center;color:var(--brand-blue,#066CFF)}
.addr--new b{color:var(--brand-blue,#066CFF)}
.addr__plus{font-size:1.2rem;font-weight:700;line-height:1}
/* Formulario de alta */
.af-field{margin-bottom:11px}
.af-field label{display:block;font-size:.78rem;font-weight:700;margin-bottom:4px}
.af-field input,.af-field select{width:100%;font:inherit;padding:9px 12px;border:1.5px solid var(--line,#e3e6ee);border-radius:9px;background:#fff;color:var(--ink,#111)}
.af-field input:focus,.af-field select:focus{outline:none;border-color:var(--brand-blue,#066CFF);box-shadow:0 0 0 3px rgba(6,108,255,.14)}
.afrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.afopt{font-weight:500;color:var(--muted,#667085);font-size:.72rem}
.afchk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.83rem;cursor:pointer}
.afchk input{width:auto;margin:0}
.afsave{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--grad-brand);color:#fff;font:inherit;font-weight:800;font-size:.95rem;cursor:pointer}
.afback{display:block;width:100%;margin-top:10px;padding:9px;border:0;background:none;color:var(--brand-blue,#066CFF);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
@media(max-width:480px){ .afrow{grid-template-columns:1fr} }

/* ── Layout: productos + pre-carrito ── */
.td-grid{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}

/* ── Panel de productos ── */
.td-panel{background:#fff;border:1px solid var(--line,#e3e6ee);border-radius:18px;overflow:hidden;
  box-shadow:0 2px 10px rgba(16,24,40,.05)}
.td-panel h2{
  margin:0;padding:14px 18px;font-size:1rem;font-weight:800;color:#fff;
  background:var(--grad-brand);display:flex;justify-content:space-between;align-items:center;gap:10px}
.td-panel h2 .count{font-size:.78rem;font-weight:600;opacity:.9}

/* Encabezado de la tabla */
.td-head,.td-row{display:grid;grid-template-columns:64px 1fr 110px 92px;gap:12px;align-items:center}
.td-head{
  padding:10px 18px;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted,#667085);border-bottom:1px solid var(--line,#e3e6ee);background:#fafbfd;
  position:sticky;top:0;z-index:2}
.td-head .r{text-align:right}

/* Zona con scroll infinito */
.td-scroll{max-height:min(62vh,640px);overflow-y:auto;overscroll-behavior:contain}
.td-row{padding:10px 18px;border-bottom:1px solid #f1f3f8;transition:background .12s}
.td-row:hover{background:var(--brand-blue-light,#EAF1FF)}
.td-row:last-child{border-bottom:0}
/* Arrastrar al pre-carrito: la fila se agarra, y el pre-carrito se resalta al arrastrar. */
.td-row[draggable="true"]{cursor:grab}
.td-row.dragging{opacity:.5;cursor:grabbing}
.td-dragging .td-cart{outline:2px dashed var(--brand-blue,#066CFF);outline-offset:4px;border-radius:18px}
.td-drop-over .td-cartbox{background:var(--brand-blue-light,#EAF1FF);box-shadow:0 0 0 3px rgba(6,108,255,.18) inset}
.td-img{width:64px;height:64px;border-radius:10px;background:#f4f6fa center/contain no-repeat;
  border:1px solid var(--line,#e3e6ee);flex:none}
.td-name{font-weight:600;font-size:.9rem;color:var(--ink,#111);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.td-meta{font-size:.75rem;color:var(--muted,#667085);margin-top:3px}
.td-price{text-align:right;font-weight:800;font-size:.95rem;color:var(--ink,#111);white-space:nowrap}
.td-price .old{display:block;font-size:.72rem;font-weight:500;color:var(--muted,#667085);text-decoration:line-through}
.td-add{
  height:38px;border-radius:10px;border:0;cursor:pointer;background:var(--brand-blue,#066CFF);color:#fff;
  font:inherit;font-weight:700;font-size:.82rem;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  transition:background .14s,transform .1s}
.td-add:hover{background:var(--brand-blue-hover,#0558CC)}
.td-add:active{transform:scale(.96)}
.td-add[disabled]{cursor:default}
/* Confirmación de "agregado": el botón late, confirma y vuelve SOLO a "+ Agregar".
   Van DESPUÉS de [disabled] a propósito: misma especificidad, gana el último. */
.td-add.done{background:var(--brand-purple,#9C1DFF);animation:tdPop .42s cubic-bezier(.34,1.56,.64,1)}
.td-add.max{background:var(--brand-orange,#FF7C19)}
@keyframes tdPop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.td-add .ck{display:inline-block;animation:tdCk .34s cubic-bezier(.34,1.56,.64,1) .04s both}
@keyframes tdCk{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
/* Destello del ítem recién agregado, para ver dónde cayó */
.td-ci.flash{animation:tdFlash .8s ease}
@keyframes tdFlash{0%{background:rgba(255,255,255,.5)}100%{background:rgba(255,255,255,.14)}}
/* Respeta a quien pide menos movimiento (mareos, vestibular) */
@media(prefers-reduced-motion:reduce){
  .td-add.done,.td-add .ck,.td-ci.flash{animation:none}
}

.td-state{padding:26px 18px;text-align:center;color:var(--muted,#667085);font-size:.9rem}
.td-sentinel{height:1px}

/* ── Pre-carrito ── */
.td-cart{position:sticky;top:16px}
.td-cartbox{background:var(--grad-brand);border-radius:18px;padding:16px;color:#fff;
  box-shadow:0 8px 24px rgba(6,108,255,.2)}
.td-cartbox h3{margin:0 0 12px;font-size:.95rem;font-weight:800;text-align:center}
.td-citems{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
.td-ci{background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;display:grid;
  grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.td-ci .th{width:38px;height:38px;flex:none;border-radius:8px;background:#fff center/contain no-repeat;
  border:1px solid rgba(255,255,255,.55)}
.td-ci .nm{font-size:.78rem;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.td-ci .pu{font-size:.72rem;opacity:.85;margin-top:2px}
.td-qty{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.2);border-radius:8px;padding:2px}
.td-qty button{width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:#fff;
  font:inherit;font-weight:800;font-size:.95rem;line-height:1;cursor:pointer;transition:background .12s}
.td-qty button:hover{background:rgba(255,255,255,.28)}
.td-qty span{min-width:22px;text-align:center;font-size:.8rem;font-weight:700}
.td-empty{text-align:center;font-size:.8rem;opacity:.85;padding:22px 6px;line-height:1.5}
.td-total{margin-top:12px;background:rgba(0,0,0,.18);border-radius:12px;padding:12px;text-align:center}
.td-total .lbl{font-size:.72rem;opacity:.85;font-weight:600}
.td-total .val{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.td-total .iva{font-size:.68rem;opacity:.8;margin-top:2px}

/* Entrega */
.td-ship{display:flex;gap:6px;margin-top:12px}
.td-ship button{flex:1;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;
  border-radius:9px;padding:7px 6px;font:inherit;font-size:.75rem;font-weight:700;cursor:pointer;transition:all .14s}
.td-ship button.on{background:#fff;color:var(--brand-blue,#066CFF);border-color:#fff}
.td-shipnote{font-size:.68rem;opacity:.85;margin-top:6px;text-align:center;line-height:1.4;min-height:1em}

.td-go{
  width:100%;margin-top:12px;height:52px;border-radius:14px;border:0;cursor:pointer;
  background:var(--brand-orange,#FF7C19);color:#fff;font:inherit;font-weight:800;font-size:.95rem;
  box-shadow:0 6px 18px rgba(255,124,25,.32);transition:transform .12s,filter .12s}
.td-go:hover:not([disabled]){transform:translateY(-1px);filter:brightness(1.06)}
.td-go[disabled]{background:#c9ced9;box-shadow:none;cursor:not-allowed}
.td-msg{font-size:.76rem;text-align:center;margin-top:8px;min-height:1em;color:#b42318;font-weight:600}
.td-msg.ok{color:#067647}

/* Volver */
.td-back{display:inline-flex;align-items:center;gap:6px;color:var(--muted,#667085);text-decoration:none;
  font-size:.85rem;font-weight:600;margin-bottom:12px}
.td-back:hover{color:var(--brand-blue,#066CFF)}

@media(max-width:980px){
  .td-grid{grid-template-columns:1fr}
  .td-cart{position:static}
  .td-head,.td-row{grid-template-columns:52px 1fr 88px 74px;gap:8px}
  .td-img{width:52px;height:52px}
  .td-scroll{max-height:none}
}
/* Móvil: el buscador ocupa su fila y los dos botones se reparten la de abajo. */
@media(max-width:560px){
  .td-top{grid-template-columns:1fr 1fr;gap:8px}
  .td-search{grid-column:1 / -1}
  .td-catbtn{height:46px;padding:0 12px;font-size:.86rem;justify-content:center}
}
</style>
</head>
<body>
<!-- Barra del e-commerce: la MISMA de la tienda/ficha (assets/shop-header.css/js).
     Aquí es de NAVEGACIÓN: buscador que enlaza a fichas, carrito/favoritos del mismo
     localStorage y categorías que llevan a la tienda con el filtro puesto. -->
<header class="shopbar">
  <!-- session-nav.js necesita #acct para arrancar; oculto, solo hospeda el menú de sesión.
       El chip visible es .tb-cuenta. Nada de class="acct" (su display le gana a [hidden]). -->
  <div id="acct" style="display:none">
    <a href="cuenta.html" id="acct-login" aria-label="Iniciar sesión">Cuenta</a>
  </div>
  <div class="shopbar__top">
    <a class="shopbar__logo" href="index.html" aria-label="Ok.station — Ir al inicio"><img src="assets/img/okstation-logo.webp" alt="Ok.station" width="158" height="24"></a>
    <!-- Sin buscador en la navbar: la compra rápida tiene el suyo propio (#tdQ), que

  <!-- Sin carril de categorías en la navbar: filtrar por categoría se hace DENTRO de la

<!-- Carrito y Favoritos: paneles EN LA PÁGINA, vinculados al mismo localStorage que la
     tienda (vía window.OKtienda de shop-cart.js). Ver aquí, sin salir de la compra rápida. -->

<script>
(function(){
  "use strict";
  /* ═══ Estado ═══ */
  var PER = 24;                 // productos por página (scroll infinito)
  var page = 1, pages = 1, loading = false, done = false;
  var q = "", cat = "";
  /* Estado del panel de filtros. fSort="name" es el orden por defecto del API (no se
     manda mientras esté así). fBrands: marcas elegidas. */
  var fBrands = [], fSort = "name", fBrandsLoaded = false, fBrandList = [];
  /* Faceta "Tipo" = subcategoría (dato real de la BD: Tinta, Tóner, Carpetas, Papel Bond…). */
  var fSubcats = [], fSubcatsLoaded = false, fSubcatList = [];
  var pre = {};                 // pre-carrito local: { id: {p, qty} }
  /* Checkout DENTRO del panel de carrito: perfil + libreta de direcciones + envío. */
  var me = null, coAddr = null, coShip = "retiro";
  var locAddrs = [];            // libreta completa (para el selector de ubicación)
  var MX_STATES = [];           // estados de MX; el API los manda (esto es respaldo por si falla)
  var SHIP_COST = 99;           // igual que ShopCatalog::SHIP_COST
  function token(){ try{ return localStorage.getItem("okstation.token") || ""; }catch(e){ return ""; } }
  function auth(){ var t = token(); return t ? { "Authorization": "Bearer " + t } : {}; }
  function shopUser(){ try{ return JSON.parse(localStorage.getItem("okstation.user")||"null"); }catch(e){ return null; } }
  /* Deja solo 10 dígitos (móvil MX). Quita la lada +52 si viene (12 dígitos). */
  function soloTel(v){ var d = String(v||"").replace(/\D/g,""); if (d.length===12 && d.slice(0,2)==="52") d=d.slice(2); return d.slice(0,10); }
  function loadMe(){
    if (!token()) return;
    fetch("backend/api/me.php", { headers: auth() }).then(function(r){ return r.json(); })
      .then(function(j){ if (j && j.ok) me = j.user; return fetch("backend/api/shop/addresses.php", { headers: auth() }); })
      .then(function(r){ return r ? r.json() : null; })
      .then(function(j){
        if (j && j.ok){
          locAddrs = j.addresses || [];
          if (j.states && j.states.length) MX_STATES = j.states;
          coAddr = locAddrs.filter(function(a){ return a.is_default; })[0] || locAddrs[0] || null;
        }
        renderLoc();
        if ($("tdCartDrawer").classList.contains("open")) renderCart();   // refresca si ya estaba abierto
      }).catch(function(){});
  }

  var $ = function(id){ return document.getElementById(id); };
  var mxn = function(n){ return "$" + (Math.round(n*100)/100).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2}); };
  var esc = function(s){ var d=document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML; };

  /* ═══ Carga de productos (paginada) ═══ */
  function load(reset){
    if (loading) return;
    if (reset){ page=1; done=false; $("tdRows").innerHTML=""; }
    if (done) return;
    loading = true;
    $("tdState").textContent = page===1 ? "Cargando productos…" : "Cargando más…";
    $("tdState").style.display = "";

    var u = "backend/api/shop/products.php?per_page="+PER+"&page="+page
          + (q ? "&q="+encodeURIComponent(q) : "")
          + (cat ? "&category="+encodeURIComponent(cat) : "")
          + (fSubcats.length ? "&subcategory="+encodeURIComponent(fSubcats.join(",")) : "")
          + (fBrands.length ? "&brand="+encodeURIComponent(fBrands.join(",")) : "")
          + (fSort !== "name" ? "&sort="+encodeURIComponent(fSort) : "");

    fetch(u).then(function(r){ return r.json(); }).then(function(j){
      loading = false;
      if (!j || !j.ok){ $("tdState").textContent = "No se pudo cargar el catálogo."; return; }
      pages = j.pages || 1;
      $("tdCount").textContent = j.total ? (j.total + (j.total===1?" producto":" productos")) : "";
      if (!j.items.length && page===1){
        $("tdState").textContent = q||cat ? "No encontramos nada con ese filtro." : "No hay productos.";
        done = true; return;
      }
      j.items.forEach(addRow);
      page++;
      if (page > pages) done = true;
      $("tdState").style.display = "none";
      /* El observador solo avisa cuando el centinela ENTRA. Si ya estaba a la vista
         (lista vacía al inicio, o una página que no llena el panel), no vuelve a
         avisar y el scroll se queda mudo. Por eso re-comprobamos al terminar. */
      setTimeout(maybeMore, 0);
    }).catch(function(){
      loading = false;
      $("tdState").textContent = "Error de conexión. Reintenta.";
    });
  }

  var byId = {};                // índice para resolver el producto al SOLTAR (drop trae solo el id)

  function addRow(p){
    byId[p.id] = p;
    var row = document.createElement("div");
    row.className = "td-row";
    row.draggable = true;                       // arrastrable al pre-carrito
    row.dataset.pid = p.id;
    var img = p.image ? '<div class="td-img" style="background-image:url('+encodeURI(p.image)+')"></div>' : '<div class="td-img"></div>';
    var old = p.old ? '<span class="old">'+mxn(p.old)+'</span>' : '';
    row.innerHTML =
      img +
      '<div><div class="td-name">'+esc(p.name)+'</div><div class="td-meta">'+esc(p.brand||"")+(p.stock<=5?' · <b>solo '+p.stock+'</b>':'')+'</div></div>' +
      '<div class="td-price">'+old+mxn(p.price)+'</div>' +
      '<div style="text-align:right"><button class="td-add" data-add="'+p.id+'">+ Agregar</button></div>';
    row.querySelector("[data-add]").addEventListener("click", function(){ addToPre(p); });
    /* Arrastrar-y-soltar: alternativa al botón (que sigue siendo el camino principal
       y el único en táctil, donde el drag HTML5 no aplica). */
    row.addEventListener("dragstart", function(e){
      e.dataTransfer.setData("text/plain", String(p.id));
      e.dataTransfer.effectAllowed = "copy";
      row.classList.add("dragging");
      document.body.classList.add("td-dragging");   // resalta la zona de drop mientras arrastras
    });
    row.addEventListener("dragend", function(){
      row.classList.remove("dragging");
      document.body.classList.remove("td-dragging");
    });
    $("tdRows").appendChild(row);
  }

  /* ═══ Pre-carrito ═══ */
  var ADD_MS = 950;   // dura la confirmación antes de volver a "+ Agregar"

  function addToPre(p){
    var b = document.querySelector('[data-add="'+p.id+'"]');
    if (b && b.disabled) return;                               // está confirmando → ignora el clic
    var cur = pre[p.id] ? pre[p.id].qty : 0;
    if (cur >= p.stock){ btnTemp(b, "max", "Máximo"); return; } // ya no hay más piezas
    if (!pre[p.id]) pre[p.id] = { p:p, qty:0 };
    pre[p.id].qty++;
    renderPre(p.id);
    btnTemp(b, "done", '<span class="ck">✓</span> Agregado');
  }

  /* Pone el botón en un estado temporal (bloqueado mientras dura la animación) y
     lo regresa solo a "+ Agregar". Así no se puede agregar de más por doble clic. */
  function btnTemp(b, cls, html){
    if (!b) return;
    b.disabled = true;
    b.classList.add(cls);
    b.innerHTML = html;
    setTimeout(function(){
      b.classList.remove(cls);
      b.disabled = false;
      b.textContent = "+ Agregar";
    }, ADD_MS);
  }

  function chg(id, d){
    var it = pre[id]; if (!it) return;
    it.qty += d;
    if (it.qty <= 0) delete pre[id];
    else if (it.qty > it.p.stock) it.qty = it.p.stock;
    renderPre();
  }
  function totals(){
    var sub = 0, n = 0;
    for (var id in pre){ sub += pre[id].p.price * pre[id].qty; n += pre[id].qty; }
    /* Solo SUBTOTAL: el envío y el IVA por geo se calculan en el checkout de la tienda. */
    return { sub:sub, total:sub, n:n };
  }
  /* flashId (opcional): id del producto recién agregado → destella para ubicarlo. */
  function renderPre(flashId){
    var box = $("tdCItems"), keys = Object.keys(pre);
    if (!keys.length){
      box.innerHTML = '<div class="td-empty">Aún no agregas nada.<br>Busca y dale <b>+ Agregar</b>.</div>';
    } else {
      box.innerHTML = keys.map(function(id){
        var it = pre[id];
        var th = it.p.image ? '<div class="th" style="background-image:url('+encodeURI(it.p.image)+')"></div>' : '<div class="th"></div>';
        return '<div class="td-ci" data-id="'+id+'">'+th+'<div><div class="nm">'+esc(it.p.name)+'</div>'+
               '<div class="pu">'+mxn(it.p.price)+' c/u</div></div>'+
               '<div class="td-qty"><button data-d="'+id+'" aria-label="Quitar uno">−</button>'+
               '<span>'+it.qty+'</span><button data-i="'+id+'" aria-label="Agregar uno">+</button></div></div>';
      }).join("");
      box.querySelectorAll("[data-i]").forEach(function(b){ b.addEventListener("click", function(){ chg(+b.dataset.i, 1); }); });
      box.querySelectorAll("[data-d]").forEach(function(b){ b.addEventListener("click", function(){ chg(+b.dataset.d, -1); }); });
      if (flashId != null){
        var el = box.querySelector('.td-ci[data-id="'+flashId+'"]');
        if (el){ el.classList.add("flash"); setTimeout(function(){ el.classList.remove("flash"); }, 800); }
      }
    }
    var t = totals();
    $("tdTotal").textContent = mxn(t.total);
    $("tdGo").disabled = t.n === 0;
    $("tdGo").textContent = t.n ? ("Enviar al carrito ("+t.n+")") : "Enviar al carrito";
  }

  /* La entrega (recoger/envío), el IVA por geo, el teléfono y la dirección se piden en
     el CHECKOUT de la tienda, no aquí: la compra rápida solo llena el carrito. */

  /* ═══ Enviar al carrito → abrir el panel para PAGAR aquí mismo ═══ */
  /* Fusiona el pre-carrito en el carrito compartido y abre el panel del carrito, donde
     está el checkout completo (envío, teléfono, pago). Todo sin salir de la compra rápida. */
  $("tdGo").addEventListener("click", function(){
    var t = totals();
    if (!t.n) return;
    var ids = Object.keys(pre);
    enviarAlCarrito();
    pre = {}; renderPre();                 // el pre-carrito ya pasó al carrito real
    /* enviarAlCarrito escribió localStorage directo; OKtienda no se enteró (su listener
       'storage' solo dispara entre pestañas). Un cambiar(id,0) lo obliga a re-hidratar
       el carrito desde el API y emitir 'carrito' → el panel se pinta completo. */
    var o = OK(); if (o && ids.length) o.cambiar(+ids[0], 0);
    renderCart(); openDrawer($("tdCartDrawer"));
  });

  /* Fusiona el pre-carrito en el carrito COMPARTIDO, SUMANDO a lo que ya hubiera y sin
     pasarse del stock. NO sobrescribe: si el cliente ya tenía cosas en el carrito de la
     tienda, se conservan. */
  function enviarAlCarrito(){
    try{
      var c = JSON.parse(localStorage.getItem("okstation_cart") || "{}") || {};
      for (var id in pre){
        var cur = parseInt(c[id], 10) || 0;
        c[id] = Math.min(pre[id].p.stock, cur + pre[id].qty);
      }
      localStorage.setItem("okstation_cart", JSON.stringify(c));
    }catch(e){}
  }

  /* ═══ Categorías ═══ */
  $("tdCatBtn").addEventListener("click", function(){
    $("tdFilts").classList.remove("open"); $("tdFiltBtn").classList.remove("on"); $("tdFiltBtn").setAttribute("aria-expanded","false");
    var open = $("tdCats").classList.toggle("open");
    $("tdCatBtn").classList.toggle("on", open);
    $("tdCatBtn").setAttribute("aria-expanded", open ? "true" : "false");
  });
  fetch("backend/api/shop/categories.php").then(function(r){ return r.json(); }).then(function(j){
    if (!j || !j.ok) return;
    var row = $("tdCatsRow");
    var all = '<button class="td-chip on" data-cat="">Todos</button>';
    row.innerHTML = all + j.categories.map(function(c){
      return '<button class="td-chip" data-cat="'+esc(c.name)+'">'+esc(c.name)+'<span class="n">'+c.count+'</span></button>';
    }).join("");
    row.querySelectorAll("[data-cat]").forEach(function(b){
      b.addEventListener("click", function(){
        cat = b.dataset.cat;
        row.querySelectorAll("[data-cat]").forEach(function(x){ x.classList.toggle("on", x===b); });
        fBrandsLoaded = false;   // las marcas se acotan a la categoría → recargar al reabrir filtros
        /* El "Tipo" es propio de cada categoría: recargar y limpiar lo elegido. */
        fSubcatsLoaded = false; fSubcats = []; filtCount();
        load(true);
      });
    });
  }).catch(function(){});

  /* ═══ Filtros (marca + orden), dentro de la compra rápida ═══
     Filtra en el SERVIDOR (ver load): el catálogo se pagina, así que filtrar en el
     navegador solo miraría la página cargada. Aplica al instante, como las categorías. */
  var TD_SORTS = [["name","Nombre (A-Z)"],["price_asc","Precio: menor a mayor"],["price_desc","Precio: mayor a menor"],["newest","Más nuevos"]];
  function filtCount(){
    var n = fBrands.length + fSubcats.length + (fSort !== "name" ? 1 : 0);
    var el = $("tdFiltCount"); el.textContent = n; el.hidden = n === 0;
    $("tdFiltBtn").classList.toggle("on", $("tdFilts").classList.contains("open"));
  }
  function filtRender(){
    var orden = TD_SORTS.map(function(s){
      return '<label class="td-fopt"><input type="radio" name="tdsort" value="'+s[0]+'"'+(fSort===s[0]?" checked":"")+'>'+esc(s[1])+'</label>';
    }).join("");
    var tipos = fSubcatsLoaded
      ? (fSubcatList.length
          ? fSubcatList.map(function(s){

  /* ═══ Scroll infinito ═══
     ¿El centinela del fondo está a la vista (o casi)? → carga la siguiente página. */
  function maybeMore(){
    if (loading || done) return;
    var seR = $("tdSentinel").getBoundingClientRect();
    /* Fondo REALMENTE visible = el menor entre el borde de la caja interna (escritorio,
       max-height 62vh) y el alto de la ventana (móvil/≤980px, donde la caja crece y quien
       hace scroll es la PÁGINA). Sin esto, en móvil scR.bottom queda muy abajo y cargaba
       TODO de golpe en vez de poco a poco. */
    var visibleBottom = Math.min($("tdScroll").getBoundingClientRect().bottom, window.innerHeight);
    if (seR.top <= visibleBottom + 240) load(false);
  }
  /* Listener de scroll en vez de IntersectionObserver (el observador con `root` no
     resultó fiable). Se limita con setTimeout y NO con requestAnimationFrame: el rAF
     se congela en pestañas ocultas y el scroll se quedaría mudo al volver.
     Se escucha en el contenedor interno Y en la ventana (móvil scrollea la ventana). */
  var tick = false;
  function onScroll(){ if (tick) return; tick = true; setTimeout(function(){ tick = false; maybeMore(); }, 120); }
  $("tdScroll").addEventListener("scroll", onScroll, { passive: true });  // caja interna (escritorio)
  window.addEventListener("scroll", onScroll, { passive: true });          // la PÁGINA (móvil/≤980px)
  window.addEventListener("resize", maybeMore);

  /* ═══ Arrastrar productos al pre-carrito ═══
     El botón "+ Agregar" sigue siendo el camino principal (y el único en táctil).
     El drop reusa addToPre(), así que respeta el tope de stock y la animación. */
  (function(){
    var zone = document.querySelector(".td-cart");
    if (!zone) return;
    function allow(e){ e.preventDefault(); e.dataTransfer.dropEffect = "copy"; zone.classList.add("td-drop-over"); }
    zone.addEventListener("dragenter", allow);
    zone.addEventListener("dragover", allow);
    zone.addEventListener("dragleave", function(e){
      /* Solo apaga el resalte al salir de la zona de verdad (no al pasar sobre un hijo). */
      if (!zone.contains(e.relatedTarget)) zone.classList.remove("td-drop-over");
    });
    zone.addEventListener("drop", function(e){
      e.preventDefault();
      zone.classList.remove("td-drop-over");
      var id = e.dataTransfer.getData("text/plain");
      var p = byId[id];
      if (p) addToPre(p);
    });
  })();

  /* ═══ Carrito y Favoritos: paneles EN LA PÁGINA ═══
     Leen y mutan el MISMO localStorage que la tienda, vía window.OKtienda (shop-cart.js).
     Los contadores de la navbar ya los mantiene shop-header.js. Aquí solo pintamos el
     detalle y actuamos (cambiar cantidad, quitar, agregar a carrito). Para PAGAR se va al
     carrito de la tienda (ahí vive el checkout: sesión, dirección, IVA y pasarela). */
  function OK(){ return window.OKtienda || null; }   // shop-cart.js lo define (carga con defer)
  function anyDrawerOpen(){ return $("tdCartDrawer").classList.contains("open") || $("tdWishDrawer").classList.contains("open") || $("tdLocDrawer").classList.contains("open"); }
  function closeDrawers(){
    $("tdCartDrawer").classList.remove("open"); $("tdCartDrawer").setAttribute("aria-hidden","true");
    $("tdWishDrawer").classList.remove("open"); $("tdWishDrawer").setAttribute("aria-hidden","true");
    $("tdLocDrawer").classList.remove("open"); $("tdLocDrawer").setAttribute("aria-hidden","true");
    $("tdScrim").hidden = true;
    document.body.style.overflow = "";
  }
  function openDrawer(el){
    closeDrawers();
    $("tdScrim").hidden = false;
    el.classList.add("open"); el.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
  }

  function cartRow(it){

      '<div class="rgt"><div class="lt">'+mxn(it.price*it.qty)+'</div><button class="lnk del" data-crm="'+it.id+'">Quitar</button></div></div>';

  function renderCart(){
    var o = OK(), items = o ? o.carrito() : [];
    if (!items.length){ $("tdCartBody").innerHTML = '<div class="td-dempty">Tu carrito está vacío.<br>Agrega productos y dale <b>Enviar al carrito</b>.</div>'; $("tdCartFoot").innerHTML = ""; return; }
    $("tdCartBody").innerHTML = items.map(cartRow).join("");

    /* ── Pie = CHECKOUT completo (se paga aquí, sin salir de la compra rápida) ── */

    var envio = coShip === "envio";
    var ship  = envio ? SHIP_COST : 0;

    var addrHtml = envio
      ? (coAddr
          ? '<div class="td-dnote" style="text-align:left;margin:0 0 10px"><b>Enviar a:</b> '+esc(coAddr.label || (coAddr.city+", "+coAddr.state))+'</div>'
          : '<div class="td-dnote" style="text-align:left;margin:0 0 10px;color:#c0342c">Agrega una dirección en <a href="perfil.html">tu cuenta</a> para envío.</div>')
      : '<div class="td-dnote" style="text-align:left;margin:0 0 10px">Recoges en OK.station · Centro Comercial Otay</div>';

    $("tdCartFoot").innerHTML =
      '<div class="co-ship">'+
        '<button type="button" data-coship="retiro" class="'+(envio?'':'on')+'">Recoger · Gratis</button>'+
        '<button type="button" data-coship="envio" class="'+(envio?'on':'')+'">Envío · '+mxn(SHIP_COST)+'</button>'+
      '</div>'+
      addrHtml+
      '<label class="co-lbl" for="coPhone">WhatsApp para avisarte</label>'+
      '<input class="co-phone" id="coPhone" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="6640000000" value="'+esc(phone)+'">'+
      '<div class="td-dtot" style="margin-top:12px"><span>Total'+(envio?' (+ envío)':'')+'</span><span class="v">'+mxn(sub+ship)+'</span></div>'+
      '<button type="button" class="td-dgo" id="coPay"'+(addrOk?'':' disabled')+'>Pagar '+mxn(sub+ship)+'</button>'+
      '<div class="td-dnote">IVA incluido · pago seguro con Mercado Pago</div>'+
      '<div class="co-msg" id="coMsg"></div>';

  /* Crea el pedido desde el carrito COMPARTIDO y va a pago.html (misma pasarela que la
     tienda). El servidor recalcula precios, IVA por geo y stock: no confía en el cliente. */
  function doCheckout(){
    var o = OK(); if (!o) return;
    var msg = $("coMsg"); if (msg){ msg.textContent = ""; }
    function bad(m){ if (msg){ msg.textContent = m; } }
    var phone = soloTel($("coPhone") && $("coPhone").value);
    if (phone.length !== 10) return bad("Ingresa un WhatsApp válido (10 dígitos).");
    var envio = coShip === "envio";
    if (envio && !coAddr) return bad("Agrega una dirección de envío en tu cuenta.");
    var items = o.carrito().map(function(it){ return { id: it.id, qty: it.qty }; });
    if (!items.length) return bad("Tu carrito está vacío.");
    var body = { items: items, ship_mode: coShip, contact_phone: phone };
    if (envio){
      body.ship_address = [coAddr.street, coAddr.ext_num, coAddr.int_num, coAddr.neighborhood, coAddr.city, coAddr.state, "CP " + coAddr.postal_code].filter(Boolean).join(", ");
      body.state = coAddr.state;   // define el IVA (8% BC / 16% nacional)
    }
    var btn = $("coPay"); if (btn){ btn.disabled = true; btn.textContent = "Procesando…"; }
    fetch("backend/api/shop/create.php", { method:"POST", headers: Object.assign({ "Content-Type":"application/json" }, auth()), body: JSON.stringify(body) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (j && j.ok && j.order){
          try{ localStorage.removeItem("okstation_cart"); }catch(e){}
          location.href = "pago.html?shop=" + j.order.id;
          return;
        }
        if (btn){ btn.disabled = false; }
        bad((j && j.error) || "No se pudo crear el pedido."); renderCart();
      }).catch(function(){ if (btn){ btn.disabled = false; } bad("Error de conexión. Reintenta."); });
  }
  function wishRow(it){
    var img = it.image ? '<span class="im" style="background-image:url('+encodeURI(it.image)+')"></span>' : '<span class="im"></span>';
    return '<div class="td-di" data-id="'+it.id+'">'+img+
      '<div><div class="nm">'+esc(it.name)+'</div><div class="pu">'+mxn(it.price)+'</div></div>'+
      '<div class="rgt"><button class="lnk" data-wadd="'+it.id+'">Agregar</button><button class="lnk del" data-wrm="'+it.id+'">Quitar</button></div></div>';

    var o = OK(), items = o ? o.deseados() : [];

  /* stopImmediatePropagation: shop-header.js (compartido) también engancha .tb-cart/.tb-fav
     y abre SUS paneles, cuyo "Finalizar compra" va a /tienda#cart (la tienda normal). Aquí
     queremos PAGAR en la página, así que bloqueamos su handler. El nuestro se registra antes
     (script inline vs. defer), así que corta el suyo. */
  $("tdCartNavBtn").addEventListener("click", function(e){ e.preventDefault(); e.stopImmediatePropagation(); renderCart(); openDrawer($("tdCartDrawer")); });
  $("tdFavBtn").addEventListener("click", function(e){ e.preventDefault(); e.stopImmediatePropagation(); renderWish(); openDrawer($("tdWishDrawer")); });
  $("tdScrim").addEventListener("click", closeDrawers);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && anyDrawerOpen()) closeDrawers(); });
  document.querySelectorAll("[data-dclose]").forEach(function(b){ b.addEventListener("click", closeDrawers); });

  /* Acciones dentro de los paneles (delegadas: el contenido se vuelve a pintar). */
  $("tdCartDrawer").addEventListener("click", function(e){
    /* Checkout: login / cambiar envío / pagar (no requieren OKtienda para el ítem). */
    if (e.target.closest("[data-cologin]")){ location.href = "cuenta.html?next=" + encodeURIComponent("tienda-dinamica.html"); return; }
    var sh = e.target.closest("[data-coship]"); if (sh){ coShip = sh.dataset.coship; renderCart(); return; }
    if (e.target.closest("#coPay")){ doCheckout(); return; }
    /* Ítems del carrito: +/− y quitar. */
    var o = OK(); if (!o) return;
    var t = e.target.closest("[data-ci],[data-cd],[data-crm]"); if (!t) return;
    if (t.hasAttribute("data-ci")) o.cambiar(+t.dataset.ci, 1);
    else if (t.hasAttribute("data-cd")) o.cambiar(+t.dataset.cd, -1);
    else if (t.hasAttribute("data-crm")) o.quitar(+t.dataset.crm);
    renderCart();   // re-pinta YA: el localStorage se actualiza en el acto (no esperar al evento)
  });
  /* Teléfono: solo 10 dígitos mientras se escribe (delegado; el pie se re-pinta). */
  $("tdCartDrawer").addEventListener("input", function(e){
    if (e.target.id !== "coPhone") return;
    var limpio = soloTel(e.target.value);
    if (e.target.value !== limpio) e.target.value = limpio;
  });
  $("tdWishDrawer").addEventListener("click", function(e){
    var o = OK(); if (!o) return;
    var t = e.target.closest("[data-wadd],[data-wrm]"); if (!t) return;
    if (t.hasAttribute("data-wadd")) o.agregar(+t.dataset.wadd, 1);   // pasa de favorito a carrito
    else if (t.hasAttribute("data-wrm")) o.toggleDeseado(+t.dataset.wrm);
    /* Re-pinta YA. Clave: agregar() saca el item de favoritos pero solo emite el evento
       'carrito', NO 'deseados' → sin esto el panel mostraría un favorito fantasma y
       "Quitar" volvería a agregarlo. */
    renderWish();
  });
  /* OKtienda avisa cuando cambia el carrito/deseados (misma pestaña) → re-pintar si el
     panel está abierto. shop-header ya actualiza los contadores por su cuenta. */
  window.addEventListener("oktienda:carrito", function(){ if ($("tdCartDrawer").classList.contains("open")) renderCart(); });
  window.addEventListener("oktienda:deseados", function(){ if ($("tdWishDrawer").classList.contains("open")) renderWish(); });

  /* ═══ Ubicación de entrega: libreta de direcciones EN LA PÁGINA ═══
     Mismas direcciones y endpoints que la tienda (tabla user_addresses). La barra
     muestra la PREDETERMINADA; elegir/agregar aquí actualiza coAddr, así el checkout
     del carrito usa la dirección elegida. */
  function authFetch(url, opts){
    opts = opts || {}; opts.headers = Object.assign({ "Content-Type":"application/json" }, auth(), opts.headers||{});
    return fetch(url, opts).then(function(r){ return r.json(); });
  }
  function renderLoc(){
    var b = $("locMain"), t = $("locTop"); if (!b) return;
    var d = token() ? coAddr : null;
    if (d){ t.hidden = false; t.textContent = "Entrega en"; b.textContent = d.city + " " + d.postal_code; }
    else { t.hidden = true; b.textContent = "Elige tu ubicación"; }

  function openLoc(){

      coAddr = locAddrs.filter(function(a){ return a.is_default; })[0] || locAddrs[0] || null;
      renderLoc();
      locAddrs.length ? locList(locAddrs) : locForm();   // sin direcciones → directo al alta

    $("tdLocBody").innerHTML =

      '<div class="afrow"><div class="af-field"><label for="afExt">Núm. exterior</label><input id="afExt" type="text" maxlength="30" placeholder="123"></div>'+
        '<div class="af-field"><label for="afInt">Interior <span class="afopt">(opcional)</span></label><input id="afInt" type="text" maxlength="30" placeholder="4B"></div></div>'+
      '<div class="af-field"><label for="afCol">Colonia</label><input id="afCol" type="text" maxlength="160" autocomplete="address-line2" placeholder="Otay Constituyentes"></div>'+
      '<div class="afrow"><div class="af-field"><label for="afCity">Ciudad</label><input id="afCity" type="text" maxlength="120" autocomplete="address-level2" placeholder="Tijuana" value="Tijuana"></div>'+

      '<div class="af-field"><label for="afNotes">Referencias <span class="afopt">(opcional)</span></label><input id="afNotes" type="text" maxlength="255" placeholder="Casa azul, portón negro, entre X y Y"></div>'+

  function saveAddr(){
    var err = $("locErr"); function bad(m){ if(err){ err.textContent=m; err.hidden=false; err.scrollIntoView({block:"nearest"}); } }
    var v = function(id){ return ($(id).value||"").trim(); };
    var body = { recipient:v("afRec"), phone:v("afPhone"), street:v("afStreet"), ext_num:v("afExt"),
                 int_num:v("afInt"), neighborhood:v("afCol"), city:v("afCity"), state:v("afState"),
                 postal_code:v("afCp"), notes:v("afNotes"), is_default:$("afDef").checked };
    if (body.recipient.length < 3)                 return bad("Escribe el nombre de quien recibe.");
    if ((body.phone.match(/\d/g)||[]).length < 10) return bad("El teléfono debe tener al menos 10 dígitos.");
    if (!body.street)                              return bad("Escribe la calle.");
    if (!body.ext_num)                             return bad("Escribe el número exterior.");
    if (!body.neighborhood)                        return bad("Escribe la colonia.");
    if (!body.city)                                return bad("Escribe la ciudad.");
    if (!/^\d{5}$/.test(body.postal_code))         return bad("El código postal debe tener 5 dígitos.");
    var btn = $("afSave"); btn.disabled = true; btn.textContent = "Guardando…";
    authFetch("backend/api/shop/address-save.php", { method:"POST", body:JSON.stringify(body) }).then(function(j){
      if (!j || !j.ok){ btn.disabled=false; btn.textContent="Agregar dirección"; return bad((j&&j.error)||"No se pudo guardar."); }
      locAddrs = j.addresses || [];
      coAddr = locAddrs.filter(function(a){ return a.is_default; })[0] || locAddrs[0] || null;
      renderLoc(); closeDrawers();
      if ($("tdCartDrawer").classList.contains("open")) renderCart();
    }).catch(function(){ btn.disabled=false; btn.textContent="Agregar dirección"; bad("Sin conexión con el servidor."); });
  }
  function pickAddr(id){
    authFetch("backend/api/shop/address-default.php", { method:"POST", body:JSON.stringify({ id:id }) }).then(function(j){
      if (!j || !j.ok) return;
      locAddrs = j.addresses || [];
      coAddr = locAddrs.filter(function(a){ return a.is_default; })[0] || locAddrs[0] || null;
      renderLoc(); closeDrawers();
      if ($("tdCartDrawer").classList.contains("open")) renderCart();
    }).catch(function(){});
  }
  $("tdLocBtn").addEventListener("click", openLoc);
  $("tdLocDrawer").addEventListener("click", function(e){
    if (e.target.closest("#addrNew")) return locForm();
    if (e.target.closest("#afBack"))  return locList(locAddrs||[]);
    if (e.target.closest("#afSave"))  return saveAddr();
    var a = e.target.closest("[data-addr]"); if (a) return pickAddr(+a.dataset.addr);
  });
  $("tdLocDrawer").addEventListener("keydown", function(e){
    if (e.key === "Enter" && e.target.tagName === "INPUT" && $("afSave")){ e.preventDefault(); saveAddr(); }
  });

  /* ═══ Arranque ═══ */
  renderPre(); load(true); renderLoc(); loadMe();
})();
</script>
