<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Puerta de mantenimiento: primero que nada, para redirigir antes de pintar. -->
<script src="/assets/site-guard.js?v=20260720a"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compra rápida | Ok.station</title>
<meta name="description" content="Arma tu pedido de papelería en segundos: busca, agrega y paga. Compra rápida de Ok.station.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="assets/shop-header.css?v=20260716a">
<link rel="stylesheet" href="assets/oki.css?v=20260716d">
<style>
/* ══════════════════════════════════════════════════════════════════
   Tienda dinámica (compra rápida) — vista de tabla + pre-carrito.
   Pensada para pedidos grandes: buscar, agregar y pagar sin navegar.
   Reusa las variables de marca de styles.css (no inventa colores).
   ══════════════════════════════════════════════════════════════════ */
.td-wrap{max-width:1240px;margin:0 auto;padding:18px 16px 60px}

/* La navbar sin buscador: el spacer ocupa el hueco central (logo izq, acciones der). */
.shopbar__spacer{flex:1 1 auto}
/* ── Barra superior: buscador + categorías + filtros ── */
.td-top{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-bottom:14px}
.td-search{position:relative}
.td-search input{
  width:100%;height:52px;border-radius:999px;border:1px solid var(--line,#e3e6ee);
  background:#fff;padding:0 18px 0 48px;font:inherit;font-size:.98rem;color:var(--ink,#111);
  box-shadow:0 1px 2px rgba(16,24,40,.04);transition:border-color .15s,box-shadow .15s}
.td-search input:focus{outline:none;border-color:var(--brand-blue,#066CFF);box-shadow:0 0 0 4px rgba(6,108,255,.12)}
.td-search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--muted,#667085);pointer-events:none}
/* ── Autocompletado: sugerencias bajo el buscador ── */
.td-ac{display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:40;
  background:#fff;border:1px solid var(--line,#e3e6ee);border-radius:16px;overflow:hidden;
  box-shadow:0 16px 42px rgba(16,24,40,.16);max-height:min(60vh,420px);overflow-y:auto}
.td-ac.show{display:block}
.td-ac__h{padding:9px 16px 6px;font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted,#667085)}
.td-ac__i{display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:center;width:100%;
  padding:9px 14px;border:0;background:none;font:inherit;text-align:left;cursor:pointer;color:var(--ink,#111)}
.td-ac__i:hover,.td-ac__i.sel{background:var(--brand-blue-light,#EAF1FF)}
.td-ac__im{width:38px;height:38px;border-radius:8px;background:#f4f6fa center/contain no-repeat;border:1px solid var(--line,#e3e6ee)}
.td-ac__nm{font-size:.88rem;font-weight:600;line-height:1.25}
.td-ac__nm mark{background:#fde68a;color:inherit;padding:0 1px;border-radius:3px}
.td-ac__mt{font-size:.75rem;color:var(--muted,#667085)}
.td-ac__pr{font-size:.85rem;font-weight:700;white-space:nowrap}
.td-ac__none{padding:16px;text-align:center;font-size:.86rem;color:var(--muted,#667085)}
.td-catbtn{
  height:52px;padding:0 20px;border-radius:999px;border:0;cursor:pointer;
  background:var(--grad-brand);color:#fff;font:inherit;font-weight:700;font-size:.92rem;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  box-shadow:0 4px 14px rgba(6,108,255,.22);transition:transform .12s,box-shadow .12s}
.td-catbtn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(6,108,255,.3)}
.td-catbtn .chev{transition:transform .18s}
.td-catbtn.on .chev{transform:rotate(180deg)}

/* Panel de categorías */
.td-cats{
  display:none;background:#fff;border:1px solid var(--line,#e3e6ee);border-radius:16px;
  padding:12px;margin-bottom:14px;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.td-cats.open{display:block}
.td-cats .row{display:flex;flex-wrap:wrap;gap:8px}
.td-chip{
  border:1px solid var(--line,#e3e6ee);background:#fff;color:var(--ink,#111);
  border-radius:999px;padding:8px 14px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;
  transition:all .14s}
.td-chip:hover{border-color:var(--brand-blue,#066CFF);color:var(--brand-blue,#066CFF)}
.td-chip.on{background:var(--grad-brand);border-color:transparent;color:#fff}
.td-chip .n{opacity:.65;font-weight:500;margin-left:5px;font-size:.78rem}
/* Botón de Filtros: secundario (contorno), para no competir con Categorías. */
.td-filtbtn{background:#fff !important;color:var(--ink,#111) !important;border:1.5px solid var(--line,#e3e6ee) !important;box-shadow:0 1px 2px rgba(16,24,40,.04) !important}
.td-filtbtn:hover{border-color:var(--brand-blue,#066CFF) !important}
.td-filtbtn .fct{background:var(--brand-blue,#066CFF);color:#fff;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;font-size:.72rem;font-weight:800;padding:0 5px}
/* Panel de filtros (reusa .td-cats como contenedor). */
.td-fgroup{padding:4px 2px 12px;border-bottom:1px solid var(--line,#eef1f6)}
.td-fgroup:last-child{border-bottom:0;padding-bottom:2px}
.td-fgroup h4{margin:0 0 8px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted,#667085)}
.td-fopt{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;margin:0 6px 6px 0;border:1px solid var(--line,#e3e6ee);border-radius:999px;font-size:.85rem;font-weight:600;cursor:pointer}
.td-fopt input{accent-color:var(--brand-blue,#066CFF);margin:0}
.td-fopt:hover{border-color:var(--brand-blue,#066CFF)}
.td-fopt .n{opacity:.6;font-weight:500;font-size:.78rem}
.td-fopt.is-hidden{display:none}
.td-fsearch,.td-fbsearch{display:block;width:min(340px,100%);margin:0 0 8px;padding:8px 12px;border:1.5px solid var(--line,#e3e6ee);border-radius:10px;font:inherit;font-size:.85rem}
.td-fsearch:focus,.td-fbsearch:focus{outline:none;border-color:var(--brand-blue,#066CFF)}
.td-fmore,.td-fbmore{display:inline-block;margin:2px 0 0;padding:6px 10px;border:0;background:none;color:var(--brand-blue,#066CFF);font:inherit;font-size:.83rem;font-weight:700;cursor:pointer}
/* ── Paneles de carrito / favoritos (cajón derecho, en la página) ── */
.td-scrim{position:fixed;inset:0;background:rgba(16,24,40,.42);z-index:70}
.td-drawer{position:fixed;top:0;right:0;height:100%;width:min(380px,92vw);background:#fff;z-index:71;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  box-shadow:-14px 0 44px rgba(16,24,40,.22)}
.td-drawer.open{transform:translateX(0)}
/* Favoritos y Dirección: MODAL CENTRADO (como la tienda normal), no cajón lateral.
   Solo cambia el posicionamiento; su estructura (encabezado + cuerpo) y su JS no cambian.
   El carrito se queda como cajón (lleva el checkout, mejor a lo alto). */
#tdWishDrawer,#tdLocDrawer,#tdPrevDrawer{
  top:50%;left:50%;right:auto;bottom:auto;height:auto;max-height:88vh;width:min(460px,92vw);
  border-radius:22px;overflow:hidden;box-shadow:0 26px 74px rgba(16,24,40,.28);
  transform:translate(-50%,-50%) scale(.96);opacity:0;visibility:hidden;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),opacity .18s,visibility .2s}
#tdWishDrawer.open,#tdLocDrawer.open,#tdPrevDrawer.open{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible}
/* ── Vista previa de producto (misma info que la de la tienda) ── */
#tdPrevDrawer{width:min(520px,94vw)}
/* Con un panel lateral abierto (descripción/ficha) el modal crece a 3 columnas,
   igual que la vista previa de la tienda (pv-3col). */
#tdPrevDrawer.pv3{width:min(1080px,96vw)}
.tdpv-grid{display:flex;align-items:stretch;max-height:calc(88vh - 62px)}
.tdpv-side{flex:0 0 270px;display:flex;flex-direction:column;border-right:1px solid var(--line,#e3e6ee);min-width:0}
.tdpv-side:last-child{border-right:0;border-left:1px solid var(--line,#e3e6ee)}
.tdpv-sideh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line,#e3e6ee);font-size:.95rem}
.tdpv-sideb{overflow:auto;padding:12px 14px;font-size:.84rem;color:#3d4a5c}
.tdpv-sideb .mfaq{margin-top:10px;padding-top:10px;border-top:1px solid var(--line,#e3e6ee)}
.tdpv-sideb .mfaq b{display:block;font-size:.8rem}
.tdpv-sideb .mfaq span{font-size:.8rem;color:var(--muted,#667085)}
@media(max-width:900px){
  #tdPrevDrawer.pv3{width:min(520px,94vw)}
  .tdpv-grid{flex-direction:column}
  .tdpv-side{flex:none;max-height:220px;border:0;border-top:1px solid var(--line,#e3e6ee)}
  .tdpv-side:last-child{border-left:0}
}
.tdpv-body{flex:1 1 auto;min-width:0;overflow:auto;padding:0 18px 18px}
.tdpv-img{height:210px;background:#f4f6fa;border-radius:14px;margin:14px 0 4px;background-size:contain;background-position:center;background-repeat:no-repeat}
.tdpv-thumbs{display:flex;gap:8px;margin:8px 0 2px}
.tdpv-thumbs button{width:52px;height:52px;border:1.5px solid var(--line,#e3e6ee);border-radius:10px;background:#fff center/cover no-repeat;cursor:pointer;padding:0}
.tdpv-thumbs button.on{border-color:#066CFF}
.tdpv-meta{font-size:.78rem;color:var(--muted,#667085);margin-top:10px;text-transform:uppercase;letter-spacing:.03em}
.tdpv-name{font-size:1.06rem;font-weight:800;margin:4px 0 8px;line-height:1.3}
.tdpv-price{font-size:1.3rem;font-weight:800}
.tdpv-price s{color:var(--muted,#667085);font-weight:500;font-size:.8em;margin-left:6px}
.tdpv-save{display:inline-block;margin-left:8px;font-size:.74rem;font-weight:800;color:#B4530A;background:#FFF3E8;border-radius:8px;padding:3px 8px}
.tdpv-stock{font-size:.8rem;font-weight:700;margin:6px 0 10px}
.tdpv-desc{font-size:.86rem;color:#3d4a5c;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tdpv-specs{list-style:none;margin:0 0 12px;padding:0;font-size:.82rem}
.tdpv-specs li{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line,#e3e6ee)}
.tdpv-specs .sk{color:var(--muted,#667085)}
.tdpv-specs .sv{text-align:right;font-weight:600}
.tdpv-full{display:block;text-align:center;font-size:.85rem;font-weight:700;color:#066CFF;text-decoration:none;padding:9px;margin-bottom:8px}
.tdpv-add{width:100%;border:0;border-radius:999px;background:#066CFF;color:#fff;font:inherit;font-weight:700;padding:13px;cursor:pointer}
.tdpv-add:disabled{opacity:.5;cursor:default}
.td-dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line,#e3e6ee);font-size:1.05rem}
.td-dx{width:34px;height:34px;border:0;background:var(--paper,#f4f6fa);border-radius:50%;font-size:1.2rem;line-height:1;cursor:pointer;color:var(--muted,#667085)}
.td-dx:hover{background:#e9edf5}
.td-dbody{flex:1 1 auto;overflow-y:auto;padding:12px 14px}
.td-dfoot{flex:none;border-top:1px solid var(--line,#e3e6ee);padding:14px 16px}
.td-dempty{text-align:center;color:var(--muted,#667085);font-size:.9rem;padding:40px 12px}
.td-di{display:grid;grid-template-columns:46px 1fr auto;gap:11px;align-items:center;padding:10px 4px;border-bottom:1px solid #f1f3f8}
.td-di:last-child{border-bottom:0}
.td-di .im{width:46px;height:46px;border-radius:8px;background:#f4f6fa center/contain no-repeat;border:1px solid var(--line,#e3e6ee)}
.td-di .nm{font-size:.86rem;font-weight:600;line-height:1.2}
.td-di .pu{font-size:.78rem;color:var(--muted,#667085);margin-top:2px}
.td-di .qty{display:inline-flex;align-items:center;gap:8px;margin-top:5px}
.td-di .qty button{width:24px;height:24px;border:1px solid var(--line,#e3e6ee);background:#fff;border-radius:6px;cursor:pointer;font-weight:700;line-height:1}
.td-di .rgt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.td-di .lt{font-size:.86rem;font-weight:700}
.td-di .lnk{border:0;background:none;color:var(--brand-blue,#066CFF);font:inherit;font-size:.78rem;font-weight:600;cursor:pointer;padding:0}
.td-di .lnk.del{color:#c0342c}
.td-dtot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-weight:800}
.td-dtot .v{font-size:1.15rem}
.td-dgo{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--grad-brand);color:#fff;font:inherit;font-weight:800;font-size:.95rem;cursor:pointer;text-align:center;text-decoration:none}
.td-dnote{text-align:center;font-size:.76rem;color:var(--muted,#667085);margin-top:8px}
/* Checkout dentro del panel de carrito */
.co-ship{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.co-ship button{padding:10px 8px;border:1.5px solid var(--line,#e3e6ee);background:#fff;border-radius:10px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--ink,#111)}
.co-ship button.on{border-color:var(--brand-blue,#066CFF);background:var(--brand-blue-light,#EAF1FF);color:var(--brand-blue,#066CFF)}
.co-lbl{display:block;font-size:.78rem;font-weight:700;margin-bottom:5px}
.co-phone{width:100%;height:44px;border:1.5px solid var(--line,#e3e6ee);border-radius:10px;padding:0 14px;font:inherit;font-size:.95rem;background:#fff;color:var(--ink,#111)}
.co-phone:focus{outline:none;border-color:var(--brand-blue,#066CFF);box-shadow:0 0 0 3px rgba(6,108,255,.14)}
.co-msg{color:#c0342c;font-size:.82rem;text-align:center;margin-top:8px;min-height:1em}
/* ── Ubicación de entrega: botón de la navbar + libreta en el cajón ── */
.tb-loc{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border:1.5px solid transparent;border-radius:12px;background:none;color:#fff;cursor:pointer;text-align:left;max-width:190px;transition:border-color .15s,background .15s}
.tb-loc:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.5)}
.tb-loc:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tb-loc svg{width:17px;height:17px;flex:none;color:#fff}
.tb-loc__txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.tb-loc small{font-size:.68rem;color:rgba(255,255,255,.75);font-weight:600}
.tb-loc b{font-size:.82rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){ .tb-loc__txt{display:none} .tb-loc{padding:9px 10px} }
/* Libreta (lista de direcciones) */
.loc-err{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#fdeaea;color:#8a1c1c;font-size:.85rem}
.addrs{display:flex;flex-direction:column;gap:9px}
.addr{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line,#e3e6ee);border-radius:12px;background:#fff;cursor:pointer;font:inherit;color:var(--ink,#111);transition:border-color .15s,box-shadow .15s}
.addr:hover{border-color:var(--brand-blue,#066CFF);box-shadow:0 6px 18px rgba(8,12,30,.10)}
.addr--on{border-color:var(--brand-blue,#066CFF);background:#f5f9ff}
.addr b{font-size:.9rem;font-weight:700}
.addr span{font-size:.82rem;color:var(--muted,#667085)}
.addr__note{font-style:italic}
/* .addr .addr__tag (no solo .addr__tag): si no, la regla .addr span de arriba —más
   específica— le gana y el texto sale gris en vez de blanco. */
.addr .addr__tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--brand-blue,#066CFF);color:#fff;font-size:.64rem;font-weight:800;vertical-align:middle}
.addr--new{flex-direction:row;align-items:center;gap:9px;border-style:dashed;justify-content:center;color:var(--brand-blue,#066CFF)}
.addr--new b{color:var(--brand-blue,#066CFF)}
.addr__plus{font-size:1.2rem;font-weight:700;line-height:1}
/* Formulario de alta */
.af-field{margin-bottom:11px}
.af-field label{display:block;font-size:.78rem;font-weight:700;margin-bottom:4px}
.af-field input,.af-field select{width:100%;font:inherit;padding:9px 12px;border:1.5px solid var(--line,#e3e6ee);border-radius:9px;background:#fff;color:var(--ink,#111)}
.af-field input:focus,.af-field select:focus{outline:none;border-color:var(--brand-blue,#066CFF);box-shadow:0 0 0 3px rgba(6,108,255,.14)}
.afrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.afopt{font-weight:500;color:var(--muted,#667085);font-size:.72rem}
.afchk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.83rem;cursor:pointer}
.afchk input{width:auto;margin:0}
.afsave{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--grad-brand);color:#fff;font:inherit;font-weight:800;font-size:.95rem;cursor:pointer}
.afback{display:block;width:100%;margin-top:10px;padding:9px;border:0;background:none;color:var(--brand-blue,#066CFF);font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
@media(max-width:480px){ .afrow{grid-template-columns:1fr} }

/* ── Layout: productos + pre-carrito ── */
.td-grid{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}

/* ── Panel de productos ── */
.td-panel{background:#fff;border:1px solid var(--line,#e3e6ee);border-radius:18px;overflow:hidden;
  box-shadow:0 2px 10px rgba(16,24,40,.05)}
.td-panel h2{
  margin:0;padding:14px 18px;font-size:1rem;font-weight:800;color:#fff;
  background:var(--grad-brand);display:flex;justify-content:space-between;align-items:center;gap:10px}
.td-panel h2 .count{font-size:.78rem;font-weight:600;opacity:.9}

/* Encabezado de la tabla */
/* Columnas: imagen · descripción · precio · botón · corazón.
   El precio cedió ancho al botón, que ahora es de ancho completo. */
.td-head,.td-row{display:grid;grid-template-columns:64px minmax(0,1fr) 96px 108px 40px;gap:12px;align-items:center}
/* Favoritos: corazón por fila, vinculado a los deseados compartidos. */
.td-wish{width:34px;height:34px;padding:0;display:grid;place-items:center;border:1px solid var(--line,#e3e6ee);
  background:#fff;border-radius:50%;cursor:pointer;color:var(--muted,#667085);fill:none;stroke:currentColor;
  transition:color .15s,border-color .15s,transform .12s}
.td-wish:hover{color:#e11d48;border-color:#e11d48;transform:scale(1.08)}
.td-wish.on{color:#e11d48;border-color:#e11d48;fill:#e11d48}
.td-wish svg{width:17px;height:17px;display:block}
.td-head{
  padding:10px 18px;font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted,#667085);border-bottom:1px solid var(--line,#e3e6ee);background:#fafbfd;
  position:sticky;top:0;z-index:2}
.td-head .r{text-align:right}
.td-head .c{text-align:center}   /* "Agregar" centrado sobre el botón de ancho completo */

/* Zona con scroll infinito */
.td-scroll{max-height:min(62vh,640px);overflow-y:auto;overscroll-behavior:contain}
.td-row{padding:10px 18px;border-bottom:1px solid #f1f3f8;transition:background .12s}
.td-row:hover{background:var(--brand-blue-light,#EAF1FF)}
.td-row:last-child{border-bottom:0}
/* Arrastrar al pre-carrito: la fila se agarra, y el pre-carrito se resalta al arrastrar. */
.td-row[draggable="true"]{cursor:grab}
.td-row.dragging{opacity:.5;cursor:grabbing}
.td-dragging .td-cart{outline:2px dashed var(--brand-blue,#066CFF);outline-offset:4px;border-radius:18px}
/* Resalte al arrastrar SOBRE el pre-carrito: se conserva el degradado (el texto es blanco),
   solo se marca con un aro claro y un brillo. Antes se ponía el fondo claro y el texto
   blanco desaparecía. */
.td-drop-over .td-cartbox{box-shadow:0 0 0 3px rgba(255,255,255,.75) inset, 0 10px 30px rgba(6,108,255,.4);filter:brightness(1.06)}
/* Bote de basura del pre-carrito: oculto salvo cuando arrastras un producto del pre-carrito. */
.td-trash{display:none;align-items:center;justify-content:center;gap:8px;margin-top:10px;padding:14px;
  border:2px dashed rgba(225,29,72,.5);border-radius:14px;color:#e11d48;font-weight:600;font-size:.85rem;
  background:rgba(225,29,72,.06);transition:background .15s,border-color .15s,transform .15s}
body.td-predrag .td-trash{display:flex}
.td-trash.over{background:rgba(225,29,72,.16);border-color:#e11d48;transform:scale(1.03)}
.td-ci[draggable="true"]{cursor:grab}
.td-ci.dragging{opacity:.5;cursor:grabbing}
.td-img{width:64px;height:64px;border-radius:10px;background:#f4f6fa center/contain no-repeat;
  border:1px solid var(--line,#e3e6ee);flex:none}
/* Producto SIN foto: wordmark Ok.station (fondo transparente) en lugar de la caja vacía. */
.td-noimg{background-image:url('assets/img/placeholder-producto.svg');background-size:82% auto}
.td-name{font-weight:600;font-size:.9rem;color:var(--ink,#111);line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  overflow-wrap:anywhere}   /* nombres largos sin espacios no ensanchan la fila */
.td-meta{font-size:.75rem;color:var(--muted,#667085);margin-top:3px}
.td-price{text-align:right;font-weight:800;font-size:.95rem;color:var(--ink,#111);white-space:nowrap}
.td-price .old{display:block;font-size:.72rem;font-weight:500;color:var(--muted,#667085);text-decoration:line-through}
/* Ancho COMPLETO de su columna: así todos los botones quedan del mismo tamaño y
   alineados fila con fila (antes el ancho dependía del texto). Píldora + sombra
   discreta, acorde al resto de la interfaz; el degradado se reserva a las acciones
   principales (Categorías, Enviar al carrito) para no saturar la tabla. */
.td-add{
  width:100%;height:38px;border-radius:999px;border:0;cursor:pointer;
  background:var(--brand-blue,#066CFF);color:#fff;
  font:inherit;font-weight:700;font-size:.82rem;letter-spacing:.01em;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
  box-shadow:0 2px 6px rgba(6,108,255,.28);
  transition:background .14s,transform .12s,box-shadow .16s}
.td-add:hover{background:var(--brand-blue-hover,#0558CC);transform:translateY(-1px);box-shadow:0 6px 14px rgba(6,108,255,.36)}
.td-add:active{transform:translateY(0) scale(.97);box-shadow:0 2px 6px rgba(6,108,255,.28)}
.td-add:focus-visible{outline:3px solid rgba(6,108,255,.4);outline-offset:2px}
.td-add[disabled]{cursor:default}
/* Confirmación de "agregado": el botón late, confirma y vuelve SOLO a "+ Agregar".
   Van DESPUÉS de [disabled] a propósito: misma especificidad, gana el último. */
.td-add.done{background:var(--brand-purple,#9C1DFF);animation:tdPop .42s cubic-bezier(.34,1.56,.64,1)}
.td-add.max{background:var(--brand-orange,#FF7C19)}
@keyframes tdPop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.td-add .ck{display:inline-block;animation:tdCk .34s cubic-bezier(.34,1.56,.64,1) .04s both}
@keyframes tdCk{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
/* Destello del ítem recién agregado, para ver dónde cayó */
.td-ci.flash{animation:tdFlash .8s ease}
@keyframes tdFlash{0%{background:rgba(255,255,255,.5)}100%{background:rgba(255,255,255,.14)}}
/* Respeta a quien pide menos movimiento (mareos, vestibular) */
@media(prefers-reduced-motion:reduce){
  .td-add.done,.td-add .ck,.td-ci.flash{animation:none}
}

.td-state{padding:26px 18px;text-align:center;color:var(--muted,#667085);font-size:.9rem}
.td-sentinel{height:1px}

/* ── Pre-carrito ── */
.td-cart{position:sticky;top:16px}
.td-cartbox{background:var(--grad-brand);border-radius:18px;padding:16px;color:#fff;
  box-shadow:0 8px 24px rgba(6,108,255,.2)}
.td-cartbox h3{margin:0 0 12px;font-size:.95rem;font-weight:800;text-align:center}
.td-citems{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
.td-ci{background:rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;display:grid;
  grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.td-ci .th{width:38px;height:38px;flex:none;border-radius:8px;background:#fff center/contain no-repeat;
  border:1px solid rgba(255,255,255,.55)}
.td-ci .nm{font-size:.78rem;font-weight:600;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.td-ci .pu{font-size:.72rem;opacity:.85;margin-top:2px}
.td-qty{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.2);border-radius:8px;padding:2px}
.td-qty button{width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:#fff;
  font:inherit;font-weight:800;font-size:.95rem;line-height:1;cursor:pointer;transition:background .12s}
.td-qty button:hover{background:rgba(255,255,255,.28)}
.td-qty span{min-width:22px;text-align:center;font-size:.8rem;font-weight:700}
.td-empty{text-align:center;font-size:.8rem;opacity:.85;padding:22px 6px;line-height:1.5}
.td-total{margin-top:12px;background:rgba(0,0,0,.18);border-radius:12px;padding:12px;text-align:center}
.td-total .lbl{font-size:.72rem;opacity:.85;font-weight:600}
.td-total .val{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.td-total .iva{font-size:.68rem;opacity:.8;margin-top:2px}

/* Entrega */
.td-ship{display:flex;gap:6px;margin-top:12px}
.td-ship button{flex:1;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;
  border-radius:9px;padding:7px 6px;font:inherit;font-size:.75rem;font-weight:700;cursor:pointer;transition:all .14s}
.td-ship button.on{background:#fff;color:var(--brand-blue,#066CFF);border-color:#fff}
.td-shipnote{font-size:.68rem;opacity:.85;margin-top:6px;text-align:center;line-height:1.4;min-height:1em}

.td-go{
  width:100%;margin-top:12px;height:52px;border-radius:14px;border:0;cursor:pointer;
  background:var(--brand-orange,#FF7C19);color:#fff;font:inherit;font-weight:800;font-size:.95rem;
  box-shadow:0 6px 18px rgba(255,124,25,.32);transition:transform .12s,filter .12s}
.td-go:hover:not([disabled]){transform:translateY(-1px);filter:brightness(1.06)}
.td-go[disabled]{background:#c9ced9;box-shadow:none;cursor:not-allowed}
.td-msg{font-size:.76rem;text-align:center;margin-top:8px;min-height:1em;color:#b42318;font-weight:600}
.td-msg.ok{color:#067647}

/* Volver */
.td-back{display:inline-flex;align-items:center;gap:6px;color:var(--muted,#667085);text-decoration:none;
  font-size:.85rem;font-weight:600;margin-bottom:12px}
.td-back:hover{color:var(--brand-blue,#066CFF)}

@media(max-width:980px){
  .td-grid{grid-template-columns:1fr}
  /* En celular el orden correcto es: PRODUCTOS arriba, pre-carrito abajo (primero
     eliges, luego revisas). Se fija con order explícito para que no dependa del
     orden del HTML (que ya se ha reacomodado varias veces). */
  .td-grid > section{order:1}
  .td-grid > .td-cart{order:2}
  .td-cart{position:static}
  .td-head,.td-row{grid-template-columns:52px minmax(0,1fr) 80px 92px 34px;gap:8px}
  .td-wish{width:30px;height:30px}
  .td-wish svg{width:15px;height:15px}
  .td-img{width:52px;height:52px}
  .td-scroll{max-height:none}
}
/* Móvil: el buscador ocupa su fila y los dos botones se reparten la de abajo. */
@media(max-width:560px){
  .td-top{grid-template-columns:1fr 1fr;gap:8px}
  .td-search{grid-column:1 / -1}
  .td-catbtn{height:46px;padding:0 12px;font-size:.86rem;justify-content:center}
  /* La 5ª columna del corazón no cabe: vuelve a 4 columnas y el corazón se monta
     SOBRE la imagen (como en las tarjetas de la tienda). Así nada se desborda. */
  .td-head,.td-row{grid-template-columns:52px minmax(0,1fr) 80px 92px}
  .td-head > div:last-child{display:none}
  .td-row{position:relative}
  .td-wish{position:absolute;left:12px;top:5px;width:24px;height:24px;
    background:rgba(255,255,255,.94);border-color:rgba(16,24,40,.12);box-shadow:0 1px 4px rgba(16,24,40,.18)}
  .td-wish svg{width:13px;height:13px}
}
</style>
</head>
<body>
<!-- Barra del e-commerce: la MISMA de la tienda/ficha (assets/shop-header.css/js).
     Aquí es de NAVEGACIÓN: buscador que enlaza a fichas, carrito/favoritos del mismo
     localStorage y categorías que llevan a la tienda con el filtro puesto. -->
<header class="shopbar">
  <!-- session-nav.js necesita #acct para arrancar; oculto, solo hospeda el menú de sesión.

      <a class="tb-wa" href="https://wa.me/526647194117?text=Hola,%20quiero%20solicitar%20informaci%C3%B3n" target="_blank" rel="noopener" aria-label="WhatsApp" title="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.945C.16 5.335 5.495 0 12.05 0a11.82 11.82 0 018.413 3.488 11.82 11.82 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.51 5.26l-.999 3.648 3.978-1.040zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.017-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.247-.694.247-1.29.173-1.414z"/></svg></a>
      <!-- Favoritos y Carrito: abren un panel EN LA PÁGINA (no navegan a la tienda).
           El href a la tienda queda como respaldo si el JS no cargó. -->
      <a class="tb-fav" id="tdFavBtn" href="tienda.html#store" aria-label="Ver favoritos" title="Favoritos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg><span class="ct" id="sbWishCount" style="display:none">0</span></a>
      <a class="tb-cart" id="tdCartNavBtn" href="tienda.html#store" aria-label="Ver carrito"><span class="ct" id="sbCartCount">0</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6"/></svg><span id="sbCartTotal">$0.00</span></a>
    </div>
  </div>
  <!-- Sin carril de categorías en la navbar: filtrar por categoría se hace DENTRO de la
       compra rápida (botón "Categorías" de la página). El carril navegaba a la tienda
       normal, que sacaba al usuario de aquí. "Volver a la tienda" queda en el cuerpo. -->
</header>
<main class="td-wrap">
  <a class="td-back" href="tienda.html">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>

    <div class="td-search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="tdQ" type="search" placeholder="Busca papel, tinta, plumas, folders…" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="tdAc" aria-label="Buscar productos">
      <div class="td-ac" id="tdAc" role="listbox" aria-label="Sugerencias"></div>
    </div>
    <button class="td-catbtn" id="tdCatBtn" type="button" aria-expanded="false">
      Categorías
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="td-catbtn td-filtbtn" id="tdFiltBtn" type="button" aria-expanded="false">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
      Filtros<span class="fct" id="tdFiltCount" hidden>0</span>
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div class="td-cats" id="tdCats"><div class="row" id="tdCatsRow"></div></div>
  <div class="td-cats" id="tdFilts"></div>

  <div class="td-grid">
    <!-- Productos -->
    <section class="td-panel">
      <h2>Productos <span class="count" id="tdCount"></span></h2>
      <!-- El encabezado va DENTRO del contenedor con scroll (y pegado arriba): si queda
           fuera, la barra de scroll lo deja ~15px más ancho que las filas y las columnas
           PRECIO/AGREGAR se desalinean. Aquí comparte el ancho exacto en cualquier SO. -->
      <div class="td-scroll" id="tdScroll">
        <div class="td-head">
          <div>Imagen</div><div>Descripción</div><div class="r">Precio</div><div class="c">Agregar</div><div aria-hidden="true"></div>
        </div>
        <div id="tdRows"></div>
        <div class="td-state" id="tdState">Cargando productos…</div>

    <!-- Pre-carrito -->
    <aside class="td-cart">
      <div class="td-cartbox">
        <h3>Pre-carrito</h3>
        <div class="td-citems" id="tdCItems"></div>
        <div class="td-total">
          <div class="lbl">Subtotal</div>
          <div class="val" id="tdTotal">$0.00</div>
          <div class="iva" id="tdIva">Envío e IVA se calculan al pagar</div>
        </div>
      </div>
      <button class="td-go" id="tdGo" disabled>Enviar al carrito</button>
      <!-- Bote de basura: aparece al arrastrar un producto DEL pre-carrito; soltarlo aquí lo descarta. -->
      <div class="td-trash" id="tdTrash" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>

<!-- Carrito y Favoritos: paneles EN LA PÁGINA, vinculados al mismo localStorage que la
     tienda (vía window.OKtienda de shop-cart.js). Ver aquí, sin salir de la compra rápida. -->
