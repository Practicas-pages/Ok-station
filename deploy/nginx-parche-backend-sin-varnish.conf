# ============================================================================
# Ok.station — PARCHE de nginx para el sitio que corre sobre el vhost de
# WordPress + Varnish de CloudPanel.
#
# OBJETIVO (seguridad de pagos): que /backend/ (la API PHP: pagos, estado,
# webhook, login…) vaya SIEMPRE directo a PHP-FPM, SIN pasar por Varnish y SIN
# caché. Nunca se debe cachear un estado de pago ni una respuesta con sesión.
#
# CÓMO APLICARLO en CloudPanel → Sites → okstation.mx → Vhost:
#   Pega el BLOQUE 1 dentro del server { ... } que escucha en 443 (el del
#   dominio okstation.mx), ANTES de la línea  "location / {"  que hace el
#   varnish_proxy_pass. El orden importa: con "^~" nginx elige este location
#   para todo lo que empiece con /backend/ y ya no lo manda a Varnish.
#
#   El BLOQUE 2 (headers de seguridad) va en el MISMO server 443, a nivel de
#   server (por ejemplo justo después de las directivas ssl).
#
# Tras pegar:  nginx -t  &&  systemctl reload nginx   (o el botón de CloudPanel).
# ============================================================================


# ─────────────────────── BLOQUE 1 — API directa (sin Varnish) ───────────────────────
# Colócalo ANTES de "location / { ... varnish_proxy_pass ... }".
location ^~ /backend/ {
    # La API jamás se cachea (ni en el navegador ni en proxies intermedios).
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_intercept_errors on;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS "on";
        fastcgi_param SERVER_PORT 443;
        # IMPRESCINDIBLE: sin esto el login/JWT no funciona (nginx no pasa
        # la cabecera Authorization a PHP-FPM por defecto).
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        try_files $uri =404;
        fastcgi_read_timeout 3600;
        fastcgi_pass 127.0.0.1:{{php_fpm_port}};
        fastcgi_param PHP_VALUE "{{php_settings}}";
    }

    # Cualquier otra cosa bajo /backend/ que no sea .php: no existe → 404.
    try_files $uri =404;
}


# ─────────────────────── BLOQUE 2 — Headers de seguridad ───────────────────────
# A nivel de server (443). La CSP incluye los dominios que Mercado Pago necesita;
# si la recortas y quitas esos dominios, el Checkout API (Brick de tarjeta) deja
# de cargar. 'unsafe-inline' en script-src es necesario por los <script> en línea
# del sitio.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://sdk.mercadopago.com https://http2.mlstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.mercadopago.com https://api.mercadolibre.com https://*.mlstatic.com; frame-src https://www.google.com https://maps.google.com https://*.mercadopago.com https://*.mercadopago.com.mx; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# NOTA: en el vhost de WordPress, el "location /" y los "location ~ \.(css|js|…)"
# tienen su PROPIO add_header, y nginx NO hereda los add_header del server dentro
# de un location que ya define add_header. Si notas que la CSP no aplica en las
# páginas, repite el bloque de headers dentro de esos location (o —lo ideal—
# mueve Ok.station a un "PHP Site" propio de CloudPanel con el vhost del repo
# deploy/nginx-okstation-vhost.conf, que ya trae todo esto sin Varnish).
