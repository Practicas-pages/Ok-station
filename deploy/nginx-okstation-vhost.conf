# ============================================================
# Ok.station — Vhost para un SITIO PHP de CloudPanel (NO WordPress)
# ------------------------------------------------------------
# Úsalo en un sitio nuevo (p. ej. v2.okstation.mx) creado como
# "PHP Site" en CloudPanel. NO lo mezcles con el sitio WordPress
# (ese usa Varnish y rompería). CloudPanel rellena los {{...}}.
# Pega esto en: Sites → (tu sitio PHP) → Vhost.
# ============================================================
server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name v2.okstation.mx;          # ← ajusta al dominio/subdominio del sitio
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  # Forzar HTTPS
  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  # Let's Encrypt
  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  index index.html index.php;

  # ⚠ AVISO: este archivo es una PLANTILLA de referencia, NO es el vhost que corre
  # en producción. El vhost real de CloudPanel tiene DOS server (uno en :443 que
  # manda a Varnish y otro en :8080 que resuelve rutas y ejecuta PHP) y su
  # `location /` es `try_files $uri/index.html $uri.html $uri/ =404;`, no el de
  # aquí abajo. Antes de sacar conclusiones sobre routing, mira el vhost VIVO en
  # CloudPanel: usar este archivo como fuente de verdad ya llevó a un diagnóstico
  # equivocado una vez. Lo que sí hay que aplicar está en nginx-seguridad.conf.

  # ── Ficha de producto de la tienda (OBLIGATORIO) ──
  # /producto/49-toner-hp-85a-negro → producto.php?id=49. El slug es solo para
  # que la URL se lea y para Google; lo que manda es el id.
  # Sin estas líneas, /producto/... cae en el try_files de abajo y devuelve la
  # PORTADA con HTTP 200 (soft-404): las fichas de producto no existirían.
  # A nivel de server: los rewrite se evalúan antes de elegir el location.
  rewrite ^/producto/([0-9]+)(?:-[^/]*)?/?$  /producto.php?id=$1  last;
  rewrite ^/producto/?$                      /tienda              permanent;

  # ── Front estático (Ok.station): sirve los .html directos ──
  # El HTML NO se cachea: así el navegador siempre lee la última versión y ve
  # los assets con su ?v= nuevo. (Los assets .css/.js sí se cachean, pero como
  # van versionados, al cambiar el ?v= se descargan frescos en cualquier navegador.)
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;
  }

  # ── API PHP (Ok.station) ──
  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTPS "on";
    # IMPRESCINDIBLE para el login con JWT (Nginx no pasa Authorization por defecto):
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    try_files $uri =404;
    fastcgi_read_timeout 3600;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_param PHP_VALUE "{{php_settings}}";
  }

  # ── Seguridad: bloquear archivos/carpetas sensibles ──
  location ~ /\.(?:env|git) { deny all; return 404; }
  location ~* /backend/\.env$ { deny all; return 404; }
  location ~* /backend/api/config\.php$ { deny all; return 404; }
  location ~* /backend/storage/ { deny all; return 404; }
  location ~* /(?:serve\.ps1|\.gitignore)$ { deny all; return 404; }
  # Runners de línea de comandos: nunca por HTTP (segunda capa; los scripts ya
  # traen su propia guarda PHP_SAPI !== 'cli').
  location ~* ^/backend/(?:tools|database)/ { deny all; return 404; }
  # Documentación interna del proyecto (.md en la raíz) y volcados.
  location ~* \.(?:md|sql|sh|ps1)$ { deny all; return 404; }

  # ── Headers de seguridad ──
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://sdk.mercadopago.com https://http2.mlstatic.com https://cdn.featurable.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.mercadopago.com https://api.mercadolibre.com https://*.mlstatic.com https://api.featurable.com; frame-src https://www.google.com https://maps.google.com https://*.mercadopago.com https://*.mercadopago.com.mx; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  # ── Compresión ──
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml;

  # ── Caché de estáticos ──
  # CSS y JS: el navegador SIEMPRE revalida con el servidor (304 si no cambió).
  # Así nunca se queda una versión vieja, aunque olvides subir el ?v=.
  location ~* \.(css|js)$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    access_log off;
  }
  # Imágenes y fuentes: caché corta y revalidable (sin "immutable").
  location ~* \.(woff2?|ttf|svg|png|jpe?g|webp|avif|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, must-revalidate" always;
    access_log off;
  }
}
