#!/usr/sbin/nft -f
# Ok.station — cerrar el origen: aceptar 80/443 SOLO desde Cloudflare.
# GENERADO por deploy/update-cf-ips.sh el 2026-07-23. SSH (22) NO se toca.
# Aplicar:   nft -f deploy/cloudflare-nft.conf
# Persistir: cópialo a /etc/nftables.conf (o un include) y 'systemctl enable --now nftables',
#            o NO sobrevive un reinicio y el origen queda abierto en silencio.
# Revertir:  nft delete table inet cloudflare   (NO 'nft flush ruleset', borra fail2ban/docker).
add table inet cloudflare
delete table inet cloudflare
table inet cloudflare {
  set cf4 { type ipv4_addr; flags interval; elements = { 173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22 } }
  set cf6 { type ipv6_addr; flags interval; elements = { 2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32 } }
  chain input {
    type filter hook input priority filter; policy accept;
    ct state established,related accept
    iif "lo" accept
    # ¿Renuevas TLS con Let's Encrypt HTTP-01? Descomenta para no bloquear la validación en :80
    # (si usas Origin CA de Cloudflare o reto DNS-01, deja esto comentado):
    # tcp dport 80 accept
    tcp dport { 80, 443 } ip  saddr != @cf4 drop
    tcp dport { 80, 443 } ip6 saddr != @cf6 drop
  }
}
