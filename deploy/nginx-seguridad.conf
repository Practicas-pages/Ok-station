# ============================================================
# Ok.station — Seguridad, HTTPS y rendimiento (Nginx / CloudPanel)
# Pega estas directivas en el "Vhost" del sitio en CloudPanel
# (dentro del bloque server { } que sirve HTTPS).
# CloudPanel ya emite y renueva el certificado SSL (Let's Encrypt).
# ============================================================

# ── Forzar HTTPS (redirección 301 desde HTTP) ──
# CloudPanel suele crear este bloque automáticamente. Si no:
#   server { listen 80; server_name okstation.mx www.okstation.mx;
#            return 301 https://$host$request_uri; }

# ── Headers de seguridad ──
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;  # HSTS (2 años)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# ── Content-Security-Policy ──
# 'unsafe-inline' en script-src es solo por los JSON-LD inline; puedes
# endurecerla con hashes/nonce si lo deseas. frame-src permite el mapa.
add_header Content-Security-Policy "default-src 'self'; \
  script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://sdk.mercadopago.com https://http2.mlstatic.com; \
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
  font-src https://fonts.gstatic.com; \
  img-src 'self' data: https:; \
  connect-src 'self' https://api.mercadopago.com https://api.mercadolibre.com https://*.mlstatic.com; \
  frame-src https://www.google.com https://maps.google.com https://*.mercadopago.com https://*.mercadopago.com.mx; \
  base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# ══════════════════════════════════════════════════════════════════════════
# LO QUE SIGUE VA EN EL **SERVER DE :8080** (el de la app), NO en el de :443.
# El vhost de CloudPanel tiene dos server: el de :443 hace de front y manda
# todo a Varnish, y el de :8080 es el que resuelve rutas y ejecuta PHP.
# Ahí es donde ya viven el `rewrite ...\.html → sin .html` y el
# `location / { try_files $uri/index.html $uri.html $uri/ =404; }`.
# ══════════════════════════════════════════════════════════════════════════

# ── 1. Ficha de producto (OBLIGATORIO para la tienda) ──
# /producto/49-toner-hp-85a-negro → producto.php?id=49
# El slug es solo para que la URL se lea y para Google; lo que manda es el id.
# Si el slug no es el correcto, producto.php responde 301 a la URL buena.
#
# Sin esto, /producto/... cae en el `try_files ... =404` del `location /` y la
# ficha NO existe. Va junto a los otros rewrite del server de :8080, ANTES del
# `location /`.
rewrite ^/producto/([0-9]+)(?:-[^/]*)?/?$  /producto.php?id=$1  last;
rewrite ^/producto/?$                      /tienda              permanent;

# ── 1b. Página de categoría (espejo de la anterior) ──
# /categoria/consumibles → categoria.php?slug=consumibles
# categoria.php ya está subido y funciona con ?slug=; sin estas líneas, los enlaces
# que él mismo genera (categoria.php:234) y su <link rel="canonical"> apuntan a
# /categoria/... y dan 404.
#
# OJO, y esto es lo que hay que recordar: la nota PARA-OSCAR-seo.md propone estas
# reglas en formato Apache (RewriteRule, para .htaccess). **El .htaccess NO se lee en
# este servidor** — okstation.mx corre sobre Nginx (CloudPanel), así que aquellas dos
# líneas no harían nada. Estas son su equivalente y sí funcionan.
rewrite ^/categoria/([a-z0-9-]+)/?$        /categoria.php?slug=$1  last;
rewrite ^/categoria/?$                     /tienda                 permanent;

# ── 2. Runners de línea de comandos: nunca por HTTP ──
# Estos SÍ hacen falta: como terminan en .php, los agarra `location ~ \.php$` y
# PHP-FPM los ejecuta (comprobado). Los scripts ya traen su propia guarda
# `PHP_SAPI !== 'cli'`; esto es la segunda capa.
#
# OJO AL ORDEN: en Nginx gana el PRIMER `location` con regex que empate, así que
# esta línea tiene que ir **ANTES** de `location ~ \.php$`. Si va después, no
# sirve de nada.
location ~* ^/backend/(tools|database)/ { deny all; return 404; }

# ── Lo que YA está protegido y NO hace falta agregar ──
# Se comprobó emulando este mismo vhost: el `location /` usa
# `try_files $uri/index.html $uri.html $uri/ =404` y NO incluye `$uri` a secas,
# así que los archivos sueltos no se sirven. Dan 404 solos:
#   /backend/.env · /LEEME-exel.md y demás .md · sample-exel-feed.json ·
#   common-passwords.txt
# Y /backend/api/config.php responde 200 con CERO bytes (PHP lo ejecuta y
# devuelve un array; no imprime nada), así que tampoco filtra credenciales.

# Verifica después de aplicar (nginx -t && systemctl reload nginx):
#   curl -sI https://okstation.mx/producto/49-lo-que-sea | head -1        # 200
#   curl -s  https://okstation.mx/producto/49-lo-que-sea | grep -o '<title>[^<]*'
#   curl -sI https://okstation.mx/backend/tools/exel-sync.php | head -1   # 404
#   curl -sI https://okstation.mx/perfil | head -1                        # 200

# ── Compresión (gzip; activa Brotli si el módulo está disponible) ──
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml;
# brotli on; brotli_comp_level 5; brotli_types text/css application/javascript application/json image/svg+xml;

# ── Caché de estáticos (inmutables con hash; aquí cache larga) ──
location ~* \.(css|js|woff2?|ttf|svg|png|jpe?g|webp|avif|ico)$ {
  expires 30d;
  add_header Cache-Control "public, max-age=2592000, immutable";
  access_log off;
}

# HTML sin caché agresiva (para ver cambios al instante)
location ~* \.html$ {
  add_header Cache-Control "public, max-age=0, must-revalidate";
}

# ── Proteger archivos sensibles ──
location ~ /\.(env|git) { deny all; return 404; }
location ~* /backend/api/config\.php$ { deny all; return 404; }
location ~* /(serve\.ps1|launch\.json)$ { deny all; return 404; }

# Runners y utilidades de línea de comandos: NUNCA por HTTP.
# Todo .php se manda a PHP-FPM, así que sin esta regla quedaban ejecutables
# desde el navegador (exel-sync reescribe el catálogo, make-admin da rol de
# administrador, migrate corre migraciones). Los scripts ya traen su propia
# guarda `PHP_SAPI !== 'cli'`; esto es la segunda capa.
location ~* ^/backend/(tools|database)/ { deny all; return 404; }

# Documentación interna del proyecto (planes, roadmap, notas de despliegue) y
# archivos que quedarían legibles por URL: .md/.txt (estructura.txt, la lista
# common-passwords.txt, cloudflare-ips.txt) y certificados .pem/.crt/.key.
# robots.txt se sirve aparte: la coincidencia EXACTA gana sobre la regex en Nginx,
# así que sigue siendo público (si luego hay ads.txt/security.txt, se añaden aquí).
location = /robots.txt { }
location ~* \.(md|sql|sh|ps1|txt|pem|crt|key)$ { deny all; return 404; }

# ── Asegurar que Nginx pase el header Authorization al PHP (JWT) ──
# (en el bloque location ~ \.php$ { ... fastcgi_pass ...; })
#   fastcgi_param HTTP_AUTHORIZATION $http_authorization;
