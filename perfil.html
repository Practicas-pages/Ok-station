<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">

  <!-- Modo mantenimiento: bloquea el acceso directo sin credenciales válidas -->
  <script src="assets/site-guard.js?v=20260625m"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Mi perfil — Ok.station</title>
  <link rel="icon" href="/assets/img/OKD-Isotipo-Azul.svg?v=20260630" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css?v=20260702a">
  <link rel="stylesheet" href="assets/auth.css?v=20260707b">
  <link rel="stylesheet" href="assets/order.css?v=20260626t">
</head>
<body class="auth-page" data-requires-auth>

  <header class="auth-top">
    <a href="index.html" class="logo"><img src="assets/img/okstation-logo.webp" alt="Ok.station" class="logo__img" width="158" height="24"></a>
    <div style="display:flex;align-items:center;gap:10px">
      <a href="index.html" class="btn btn--light btn--sm" aria-label="Ir al inicio del sitio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 001 1h12a1 1 0 001-1V9.5"/><path d="M10 21v-6h4v6"/></svg>
        Inicio
      </a>
      <button type="button" id="btn-logout" class="auth-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
    </div>
  </header>

  <main class="auth-main" id="profile-page" style="align-items:flex-start">
    <div class="wrap" style="width:100%">
      <div class="profile-grid">

        <!-- Columna lateral -->
        <aside class="profile-side">
          <div class="profile-avatar" id="profile-avatar" aria-hidden="true">U</div>
          <h2 data-user-name>Usuario</h2>
          <p data-user-email>—</p>
          <nav class="profile-nav" aria-label="Navegación de la cuenta">
            <a href="#pedidos">Mis pedidos</a>
            <a href="#citas">Mis citas</a>
            <!-- Solo visible para empleado/administrador (lo activa auth.js según el rol) -->
            <a href="admin.html" id="profile-admin-link" hidden style="margin-top:8px;background:var(--brand-blue-light);color:var(--brand-blue);font-weight:600">
              ▸ Panel administrativo
            </a>
            <!-- Datos sensibles (editar info + contraseña): ocultos hasta que el usuario los abre -->
            <a href="#datos" class="profile-nav__datos" id="toggle-datos" role="button" aria-expanded="false" aria-controls="account-settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
              <span>Datos personales</span>
            </a>
          </nav>
        </aside>

        <!-- Contenido -->
        <div>
          <!-- Lo primero que ve el usuario al abrir su perfil: pedidos y citas -->

          <!-- Mis pedidos (historial) -->
          <section class="profile-panel" id="pedidos">
            <h3>Mis pedidos</h3>
            <a class="btn btn--primary btn--sm" href="pedido.html" style="margin-bottom:16px">+ Haz un pedido nuevo</a>
            <div class="orders-list" id="orders-history"></div>
          </section>

          <!-- Citas registradas (historial). Oculto por defecto: se muestra al
               tocar "Mis citas" en la barra (navegación por pestañas, sin scroll). -->
          <section class="profile-panel" id="citas" hidden>
            <h3>Citas registradas</h3>
            <a class="btn btn--primary btn--sm" href="index.html#citas" style="margin-bottom:16px">+ Agenda una cita</a>
            <div class="orders-list" id="appts-history"></div>
          </section>

          <!-- Datos personales (sensibles): editar información + cambiar contraseña.
               Ocultos por defecto; se muestran al tocar "Datos personales" 🔒 en la barra. -->
          <div id="account-settings" hidden>
            <!-- Información personal -->
            <section class="profile-panel" id="info">
              <h3>Información personal</h3>
              <div class="auth-alert" id="profile-alert" role="alert" hidden></div>
              <form id="profile-form" novalidate>
                <div class="auth-field">
                  <label for="pf-name">Nombre completo</label>
                  <input type="text" id="pf-name" name="full_name" autocomplete="name" required>
                </div>
                <div class="auth-row">
                  <div class="auth-field">
                    <label for="pf-email">Correo electrónico</label>
                    <input type="email" id="pf-email" name="email" autocomplete="email" disabled data-user-email-input>
                    <span class="auth-field__hint">El correo no se puede cambiar.</span>
                  </div>
                  <div class="auth-field">
                    <label for="pf-phone">Teléfono / WhatsApp</label>
                    <input type="tel" id="pf-phone" name="phone" autocomplete="tel" inputmode="tel" required>
                  </div>
                </div>
                <button type="submit" class="btn btn--primary">Guardar cambios</button>
              </form>
            </section>

            <!-- Cambiar contraseña -->
            <section class="profile-panel" id="password">
              <h3>Cambiar contraseña</h3>
              <div class="auth-alert" id="password-alert" role="alert" hidden></div>
              <form id="password-form" novalidate>
                <div class="auth-field">
                  <label for="cp-current">Contraseña actual</label>
                  <input type="password" id="cp-current" name="current_password" autocomplete="current-password" required>
                </div>
                <div class="auth-row">
                  <div class="auth-field">
                    <label for="cp-new">Nueva contraseña</label>
                    <input type="password" id="cp-new" name="new_password" autocomplete="new-password" required>
                    <span class="auth-field__hint">Mínimo 8 caracteres, con letras y números.</span>
                  </div>
                  <div class="auth-field">
                    <label for="cp-new2">Confirmar nueva</label>
                    <input type="password" id="cp-new2" name="new_password_confirm" autocomplete="new-password" required>
                  </div>
                </div>
                <button type="submit" class="btn btn--primary">Actualizar contraseña</button>
              </form>
            </section>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/phone-cc.js?v=20260702a" defer></script>
  <script src="assets/auth.js?v=20260708d" defer></script>
  <!-- Librerías para regenerar el comprobante PDF de cita -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="assets/cita-ticket.js?v=20260707d" defer></script>
  <script src="assets/orders-history.js?v=20260630" defer></script>
  <script src="assets/appointments-history.js?v=20260707c" defer></script>
  <!-- Aviso al volver del checkout de pago (Mercado Pago / pasarela) -->
  <script src="assets/pago-return.js?v=20260630" defer></script>
</body>
</html>
